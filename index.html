<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trip.AI</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#f5f5f7">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<!-- default: iOS가 상태바 아래부터 화면을 시작합니다.
     black-translucent로 하면 상단 바가 상태바 밑에 깔려 터치가 막힙니다. -->
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Trip.AI">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root { --sab: 0px; }   /* 기본값. 실제 값은 아래 토큰 블록에서 env()로 설정 */
/* ═══════════════════════════════════════════════════
   토큰 — Apple 가이드에서 색·타입·여백은 유지,
   반경과 깊이만 리퀴드 글래스로 교체
   ═══════════════════════════════════════════════════ */
:root {
  --primary:        #0066cc;
  --primary-focus:  #0071e3;
  --ink:            #1d1d1f;
  --body-muted:     #cccccc;
  --ink-80:         #333333;
  --ink-48:         #6b6b70;
  --divider-soft:   #f0f0f0;
  --hairline:       #e0e0e0;
  --canvas:         #ffffff;
  --parchment:      #f5f5f7;
  --pearl:          #fafafc;
  --tile-3:         #252527;

  /* 분류 색 — 차트·범례·목록 점에만 사용 (버튼/링크는 여전히 파랑 하나) */
  --k-food:  #B65724;
  --k-move:  #2F6DA8;
  --k-stay:  #7154A0;
  --k-see:   #2C7D58;
  --k-shop:  #B04A7C;
  --k-cafe:  #866440;
  --k-etc:   #7B7E85;
  --on-dark:        #ffffff;

  /* 유리 */
  --glass:      rgba(255, 255, 255, 0.62);
  --glass-deep: rgba(255, 255, 255, 0.78);
  --glass-edge: rgba(255, 255, 255, 0.72);
  --glass-blur: saturate(185%) blur(24px);
  --lift-1: 0 1px 1px rgba(20, 25, 45, .04), 0 6px 18px rgba(20, 25, 45, .06);
  --lift-2: 0 1px 2px rgba(20, 25, 45, .05), 0 14px 38px rgba(20, 25, 45, .10);
  --spec:   inset 0 1px 0 rgba(255, 255, 255, .85);

  /* 반경 — 전부 키움 */
  --r-sm:   12px;
  --r-md:   18px;
  --r-lg:   26px;
  --r-xl:   34px;
  --r-pill: 9999px;

  --s-xxs: 4px;  --s-xs: 8px;  --s-sm: 12px; --s-md: 17px;
  --s-lg: 24px;  --s-xl: 32px; --s-xxl: 48px;

  --sf: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text",
        "Apple SD Gothic Neo", "Pretendard Variable", Pretendard, system-ui, sans-serif;

  --ts: 1;            /* 글자 배율 — 설정에서 바뀜 */
  --vvh: 100vh;       /* 실제 보이는 높이 (키보드 제외) */
  --kb:  0px;         /* 키보드 높이 */
  --sab: env(safe-area-inset-bottom, 0px);   /* PWA: 홈 인디케이터 높이. iframe 래퍼 없이 네이티브로 측정 */
  --shell: 480px;
  /* 상단 알약 높이. 44px 버튼 + 위아래 4px.
     .shell의 padding-top과 .hero의 음수 마진이 이 값을 함께 쓰므로
     여기만 바꾸면 셋이 일관되게 따라옵니다. */
  --bar: 52px;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }

html { background: var(--parchment); }
body {
  color: var(--ink);
  font-family: var(--sf);
  font-size: calc(17px * var(--ts)); font-weight: 400; line-height: 1.47; letter-spacing: calc(-0.374px * var(--ts));
  -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%;
  display: flex; justify-content: center; min-height: 100vh;
  /* 유리가 굴절할 대상. 이게 없으면 blur는 그냥 반투명 사각형이 됩니다 */
  /* 색조 없이 밝기 차이만 — 유리는 테두리와 그림자로 읽히게 합니다 */
  background:
    radial-gradient(1200px 620px at 8% -8%,  #ffffff 0%, rgba(255,255,255,0) 58%),
    radial-gradient(900px 640px at 92% 106%, #e8e8ec 0%, rgba(232,232,236,0) 56%),
    var(--parchment);
  background-attachment: fixed;
}

button, input, select, textarea { font: inherit; color: inherit; background: none; border: none; }
button { cursor: pointer; }
button:active { transform: scale(0.95); }
a { color: inherit; text-decoration: none; }
svg { display: block; flex: none; }
:focus-visible { outline: 2px solid var(--primary-focus); outline-offset: 3px; }

/* ── 유리 레시피 ──
   채움을 낮추고 가장자리에 빛을 맺어 '두께'를 만듭니다.
   backdrop에 brightness/contrast를 걸어야 뒤가 비치면서도 글자가 읽힙니다. */
.glass, .glass-deep { position: relative; isolation: isolate; }

.glass {
  background: linear-gradient(158deg, rgba(255,255,255,.40) 0%, rgba(255,255,255,.22) 52%, rgba(255,255,255,.34) 100%);
  backdrop-filter: blur(26px) saturate(150%) brightness(1.12);
  -webkit-backdrop-filter: blur(26px) saturate(150%) brightness(1.12);
  border: 1px solid rgba(255,255,255,.42);
  box-shadow:
    inset 0 1.2px 0 rgba(255,255,255,.92),      /* 윗면 반사 */
    inset 0 -1px 0 rgba(255,255,255,.34),       /* 아랫면 반사광 */
    inset 0 -14px 22px -14px rgba(255,255,255,.30),
    0 0 0 0.5px rgba(16,20,35,.07),        /* 흰 배경에서도 윤곽이 보이도록 */
    0 10px 30px rgba(16,20,35,.14),
    0 2px 6px rgba(16,20,35,.06);
}
.glass-deep {
  background: linear-gradient(158deg, rgba(255,255,255,.62) 0%, rgba(255,255,255,.46) 55%, rgba(255,255,255,.58) 100%);
  backdrop-filter: blur(30px) saturate(200%) brightness(1.08);
  -webkit-backdrop-filter: blur(30px) saturate(200%) brightness(1.08);
  border: 1px solid rgba(255,255,255,.5);
  box-shadow:
    inset 0 1.2px 0 rgba(255,255,255,.95),
    inset 0 -1px 0 rgba(255,255,255,.4),
    0 -8px 40px rgba(16,20,35,.18);
}

/* 테두리에서 빛이 꺾이는 느낌 — 유리 두께의 핵심 */
.glass::after, .glass-deep::after {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  border-radius: inherit;
  box-shadow:
    inset 0 0 0 0.5px rgba(255,255,255,.55),
    inset 0 3px 8px -4px rgba(255,255,255,.75),
    inset 0 -10px 18px -12px rgba(255,255,255,.45);
}
/* 위쪽에 맺히는 하이라이트 (스페큘러) */
.glass::before {
  content: ""; position: absolute; left: 8%; right: 8%; top: 0; height: 46%;
  pointer-events: none; border-radius: inherit;
  background: linear-gradient(to bottom, rgba(255,255,255,.30), rgba(255,255,255,0));
  opacity: .9;
}

.muted { color: var(--ink-48); }
.muted-80 { color: var(--ink-80); }
.ty-caption-st { font-size: calc(14px * var(--ts)); font-weight: 600; line-height: 1.29; letter-spacing: calc(-0.224px * var(--ts)); }

.shell {
  width: 100%; max-width: var(--shell);
  min-height: 100vh;
  padding-top: calc(var(--bar) + 20px);
  padding-bottom: calc(96px + var(--sab));
}

/* ── 상단 유리 바 (히어로 사진 위를 떠다님) ── */
.topbar {
  position: fixed; top: 10px; z-index: 1200;
  /* 화면이 좁으면 가장자리 12px, 넓으면 shell 오른쪽 끝에서 12px 안쪽.
     width를 주지 않아 내용만큼만 차지하는 짧은 알약이 됩니다. */
  right: max(12px, calc(50% - var(--shell) / 2 + 12px));
  height: var(--bar);
  border-radius: var(--r-pill);
  display: flex; align-items: center; gap: var(--s-xs);
  padding: 0 8px;
}
.gbtn {
  width: 40px; height: 40px; border-radius: var(--r-pill);
  display: grid; place-items: center; color: var(--ink);
}
/* 상단바 안에서는 애플 권장 최소 터치 크기(44px)를 지킵니다 */
.topbar .gbtn { width: 44px; height: 44px; }
/* 왼쪽 알약. 오른쪽 것과 같은 규칙을 좌우만 뒤집습니다. */
.topbar--l { right: auto; left: max(12px, calc(50% - var(--shell) / 2 + 12px)); }
.tbtxt {
  height: 44px; padding: 0 10px; border: 0; background: none; color: var(--ink);
  display: flex; align-items: center; gap: 6px;
  font-size: calc(15px * var(--ts)); font-weight: 600; letter-spacing: calc(-0.3px * var(--ts));
}
.tbn {
  min-width: 20px; height: 20px; padding: 0 6px; border-radius: var(--r-pill);
  background: rgba(0,0,0,.07); color: var(--ink-48);
  display: grid; place-items: center; font-size: calc(12px * var(--ts)); font-weight: 600;
}
.topbar.on-dark .tbtxt { color: #fff; }
.topbar.on-dark .tbn { background: rgba(255,255,255,.2); color: #fff; }
.gbtn:active { background: rgba(0,0,0,.05); }

/* ── 버튼 ── */
.btn-primary {
  background: var(--primary); color: var(--on-dark);
  font-size: calc(17px * var(--ts)); font-weight: 400; letter-spacing: calc(-0.374px * var(--ts));
  border-radius: var(--r-pill); padding: 11px 22px; min-height: 44px;
  box-shadow: 0 2px 10px rgba(0, 102, 204, .28);
}
.btn-primary.sm { padding: 8px 17px; min-height: 38px; font-size: calc(15px * var(--ts)); letter-spacing: calc(-0.3px * var(--ts)); }
.link { color: var(--primary); font-size: calc(17px * var(--ts)); font-weight: 400; letter-spacing: calc(-0.374px * var(--ts)); }
.link.sm { font-size: calc(15px * var(--ts)); letter-spacing: calc(-0.3px * var(--ts)); }
.link-quiet { color: var(--ink-48); font-size: calc(15px * var(--ts)); letter-spacing: calc(-0.3px * var(--ts)); }

.view { display: none; }
.view.is-on { display: block; }

/* ── 히어로: 둥근 사진 판 ── */
.hero {
  position: relative;
  margin: calc(-1 * (var(--bar) + 20px)) var(--s-sm) 0;
  border-radius: var(--r-xl);
  overflow: hidden;
  background: var(--tile-3);
  box-shadow: var(--lift-2);
}
.hero img { width: 100%; height: 360px; object-fit: cover; display: block; }
.hero__scrim { position: absolute; inset: 0;
  background: linear-gradient(to top, rgba(0,0,0,.74), rgba(0,0,0,.14) 56%, rgba(0,0,0,.18)); }
.hero__body { position: absolute; left: var(--s-lg); right: var(--s-lg); bottom: var(--s-lg); color: var(--on-dark); }
.hero__eyebrow {
  display: inline-block; font-size: calc(12px * var(--ts)); font-weight: 600; letter-spacing: calc(-0.12px * var(--ts));
  background: rgba(255,255,255,.18); border: 0.5px solid rgba(255,255,255,.34);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  padding: 5px 12px; border-radius: var(--r-pill); margin-bottom: var(--s-sm);
}
.hero__h { font-size: calc(34px * var(--ts)); font-weight: 600; line-height: 1.15; letter-spacing: calc(-0.374px * var(--ts)); }
.hero__sub { font-size: calc(17px * var(--ts)); font-weight: 400; letter-spacing: calc(-0.374px * var(--ts)); color: rgba(255,255,255,.76); margin-top: var(--s-xxs); }

/* ── 정보 알약 ── */
.facts { display: flex; gap: var(--s-xs); padding: var(--s-sm) var(--s-sm) 0; overflow-x: auto; scrollbar-width: none; }
.facts::-webkit-scrollbar { display: none; }
.facts span {
  display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
  padding: 8px 14px; border-radius: var(--r-pill);
  font-size: calc(14px * var(--ts)); font-weight: 400; letter-spacing: calc(-0.224px * var(--ts)); color: var(--ink-80);
}
.facts b { font-weight: 600; color: var(--ink); }
.facts .dot { width: 7px; height: 7px; border-radius: var(--r-pill); background: var(--primary); }
.facts .dot.is-off { background: var(--ink-48); }

/* ── 카드 ── */
.stack { display: grid; gap: var(--s-sm); padding: var(--s-sm); }
.card { border-radius: var(--r-lg); padding: var(--s-lg); }
/* 카드가 완전히 희면 그 위의 유리가 굴절할 게 없습니다.
   밝기 보정을 빼야 배경색이 통과합니다 (바와 달리 어두운 사진 위에 놓이지 않음) */
.card, .tlcard {
  background: linear-gradient(158deg, rgba(255,255,255,.62) 0%, rgba(255,255,255,.44) 60%, rgba(255,255,255,.56) 100%);
  backdrop-filter: blur(20px) saturate(120%);
  -webkit-backdrop-filter: blur(20px) saturate(120%);
}

/* ── 지금 ── */
.now__label { font-size: calc(14px * var(--ts)); font-weight: 600; letter-spacing: calc(-0.224px * var(--ts)); color: var(--primary); margin-bottom: var(--s-xs); }
.now__h { font-size: calc(30px * var(--ts)); font-weight: 600; line-height: 1.16; letter-spacing: calc(-0.374px * var(--ts)); }
.now__meta { font-size: calc(17px * var(--ts)); letter-spacing: calc(-0.374px * var(--ts)); color: var(--ink-48); margin-top: var(--s-xs); }
.now__track { height: 6px; border-radius: var(--r-pill); background: rgba(0,0,0,.06); margin-top: var(--s-md); overflow: hidden; }
.now__fill { height: 100%; border-radius: var(--r-pill); background: var(--primary); transition: width .4s linear; }
.now__next {
  display: flex; align-items: baseline; gap: var(--s-xs);
  margin-top: var(--s-md); padding-top: var(--s-md);
  border-top: 0.5px solid rgba(0,0,0,.08);
  font-size: calc(15px * var(--ts)); letter-spacing: calc(-0.3px * var(--ts)); color: var(--ink-48);
}
.now__next b { font-size: calc(17px * var(--ts)); font-weight: 600; letter-spacing: calc(-0.374px * var(--ts)); color: var(--ink); }
.now__next time { margin-left: auto; color: var(--primary); font-weight: 600; }

/* ── 하루 카드 ── */
.dayhd { display: flex; align-items: baseline; gap: var(--s-xs); margin-bottom: var(--s-sm); }
.dayhd__n { font-size: calc(21px * var(--ts)); font-weight: 600; letter-spacing: calc(0.231px * var(--ts)); }
.dayhd__d { font-size: calc(14px * var(--ts)); letter-spacing: calc(-0.224px * var(--ts)); color: var(--ink-48); }
.dayhd__now {
  margin-left: auto; font-size: calc(12px * var(--ts)); font-weight: 600; letter-spacing: calc(-0.12px * var(--ts));
  color: var(--primary); background: rgba(0,102,204,.10);
  padding: 3px 10px; border-radius: var(--r-pill);
}
.dline {
  display: flex; align-items: baseline; gap: var(--s-sm);
  padding: 9px 0; border-top: 0.5px solid rgba(0,0,0,.07);
  font-size: calc(17px * var(--ts)); letter-spacing: calc(-0.374px * var(--ts));
}
.dline time { width: calc(50px * var(--ts)); flex: none; font-size: calc(14px * var(--ts)); letter-spacing: calc(-0.224px * var(--ts)); color: var(--ink-48); }
.dline span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card .link { display: inline-block; margin-top: var(--s-sm); }

/* ── 지도 ── */
.mapcard {
  margin: var(--s-sm); border-radius: var(--r-xl); overflow: hidden;
  box-shadow: var(--lift-2);
  position: relative; z-index: 0; isolation: isolate;   /* Leaflet 내부 z-index가 밖으로 새지 않게 */
}
#map { width: 100%; height: 250px; background: var(--parchment); }
.map-note { padding: var(--s-xs) var(--s-lg) 0; font-size: calc(13px * var(--ts)); letter-spacing: calc(-0.2px * var(--ts)); color: var(--ink-48); }
.pin {
  width: 28px; height: 28px; border-radius: var(--r-pill);
  background: var(--primary); color: var(--on-dark); border: 2px solid var(--canvas);
  display: grid; place-items: center; font-size: calc(12px * var(--ts)); font-weight: 600;
  box-shadow: 0 3px 10px rgba(0,0,0,.24);
}
/* 후보 핀 — 일정 핀과 섞이지 않게 번호 없이 작고 흐리게. 아직 정해진 자리가 아니라는 뜻입니다. */
.pin--cand {
  width: 18px; height: 18px; background: var(--canvas);
  border: 2px dashed var(--ink-48); box-shadow: 0 2px 6px rgba(0,0,0,.18);
}

/* ── 칩: 탭바와 같은 문법 (트랙 하나 + 선택된 것만 알약) ── */
.chiprow { padding: var(--s-sm) var(--s-sm) 0; }
.chiprow + .chiprow { padding-top: var(--s-xs); }
.chips {
  display: flex; gap: 2px; padding: 5px;
  border-radius: var(--r-pill);
  overflow-x: auto; scrollbar-width: none;
  width: fit-content; max-width: 100%;   /* 칩 수만큼만 — 빈 유리가 남지 않게 */
}
.chips::-webkit-scrollbar { display: none; }
.chip {
  background: none; border: none; box-shadow: none;
  color: var(--ink-48);
  font-size: calc(15px * var(--ts)); font-weight: 400; letter-spacing: calc(-0.3px * var(--ts));
  border-radius: var(--r-pill); padding: 8px 16px;
  white-space: nowrap; min-height: 38px; flex: none;
  transition: color .18s, background .18s;
}
.chip:active { transform: none; }
.chip.is-on {
  color: var(--primary); font-weight: 600;
  background: linear-gradient(160deg, rgba(255,255,255,.95), rgba(255,255,255,.76));
  border: 0.5px solid rgba(255,255,255,.88);
  box-shadow: inset 0 1px 0 rgba(255,255,255,1), 0 3px 10px rgba(16,20,35,.12);
}

/* ── 타임라인 ── */
.dayhead { padding: var(--s-lg) var(--s-lg) var(--s-xs); font-size: calc(14px * var(--ts)); font-weight: 600; letter-spacing: calc(-0.224px * var(--ts)); color: var(--ink-48); }
/* 하루 요약 — 날짜 옆에 붙습니다. 이동이 많은 날은 '빡셈'이 뜹니다. */
.daystat { font-weight: 400; font-size: calc(12px * var(--ts)); margin-left: 6px; }
.daystat b { color: var(--k-food); font-weight: 600; }
/* 노선 딱지 — 도쿄 역 안내판과 같은 색입니다 */
.ln {
  display: inline-block; margin-left: 5px; padding: 1px 7px; border-radius: var(--r-pill);
  background: #888; color: #fff; font-size: calc(11px * var(--ts)); font-weight: 600;
  letter-spacing: 0; vertical-align: middle; white-space: nowrap;
}
.tlcard { border-radius: var(--r-lg); overflow: hidden; }
.ev { border-top: 0.5px solid rgba(0,0,0,.07); }
.ev:first-child { border-top: none; }
.ev__row { display: flex; gap: var(--s-sm); padding: 11px var(--s-lg); align-items: baseline; }
.ev__t { width: calc(50px * var(--ts)); flex: none; font-size: calc(14px * var(--ts)); letter-spacing: calc(-0.224px * var(--ts)); color: var(--ink-48); }
.ev.is-now .ev__t { color: var(--primary); font-weight: 600; }
.ev__b { flex: 1; min-width: 0; }
.ev__ttl { font-size: calc(16px * var(--ts)); font-weight: 600; line-height: 1.24; letter-spacing: calc(-0.352px * var(--ts)); }
.ev__sub { font-size: calc(13px * var(--ts)); letter-spacing: calc(-0.2px * var(--ts)); color: var(--ink-48); margin-top: 2px; }
.ev__chev { color: var(--ink-48); align-self: center; transition: transform .22s; }
.ev.is-open .ev__chev { transform: rotate(90deg); }

.detail { display: none; padding: 0 var(--s-lg) var(--s-md) calc(var(--s-lg) + 50px * var(--ts) + var(--s-sm)); }
.ev.is-open .detail { display: block; }
.drow {
  background: rgba(255,255,255,.55); border: 0.5px solid rgba(255,255,255,.7);
  border-radius: var(--r-md); padding: var(--s-sm) 15px; margin-bottom: var(--s-xs);
  font-size: calc(14px * var(--ts)); line-height: 1.43; letter-spacing: calc(-0.224px * var(--ts)); color: var(--ink-80);
}
.drow b { font-weight: 600; color: var(--ink); }
.dnote { font-size: calc(14px * var(--ts)); line-height: 1.43; letter-spacing: calc(-0.224px * var(--ts)); color: var(--ink-80); padding: var(--s-xs) 2px; }
.dacts { display: flex; align-items: center; gap: var(--s-md); margin-top: var(--s-sm); }

/* ── 지출 ── */
.total__n { font-size: calc(40px * var(--ts)); font-weight: 600; line-height: 1.1; }
.total__k { font-size: calc(17px * var(--ts)); letter-spacing: calc(-0.374px * var(--ts)); color: var(--ink-48); margin-top: var(--s-xxs); }
.bar { display: flex; height: 12px; border-radius: var(--r-pill); overflow: hidden; margin-top: var(--s-lg); gap: 2px; }
.bar i { display: block; height: 100%; }
.legend { display: flex; flex-wrap: wrap; gap: var(--s-xs) var(--s-md); margin-top: var(--s-sm); }
.legend span { display: inline-flex; align-items: center; gap: var(--s-xs); font-size: calc(14px * var(--ts)); letter-spacing: calc(-0.224px * var(--ts)); color: var(--ink-48); }
.legend i { width: 8px; height: 8px; border-radius: var(--r-pill); }
.legend b { font-weight: 600; color: var(--ink); }

.settle__r { display: flex; align-items: baseline; gap: var(--s-xs); padding: 5px 0; font-size: calc(17px * var(--ts)); letter-spacing: calc(-0.374px * var(--ts)); }
.settle__r b { font-weight: 600; }
.settle__r em { margin-left: auto; font-style: normal; font-weight: 600; }

.crow { display: flex; align-items: center; gap: var(--s-sm); padding: 10px var(--s-lg); border-top: 0.5px solid rgba(0,0,0,.07); }
.crow:first-child { border-top: none; }
.crow__b { flex: 1; min-width: 0; }
.crow__t { font-size: calc(16px * var(--ts)); font-weight: 600; line-height: 1.24; letter-spacing: calc(-0.352px * var(--ts)); }
.crow__s { font-size: calc(13px * var(--ts)); letter-spacing: calc(-0.2px * var(--ts)); color: var(--ink-48); margin-top: 1px; }
.crow__n { text-align: right; }
.crow__n b { font-size: calc(17px * var(--ts)); font-weight: 600; letter-spacing: calc(-0.374px * var(--ts)); }
.crow__n small { display: block; font-size: calc(12px * var(--ts)); letter-spacing: calc(-0.12px * var(--ts)); color: var(--ink-48); }

.lgroup { padding: var(--s-md) var(--s-lg) var(--s-xxs); font-size: calc(13px * var(--ts)); font-weight: 600; letter-spacing: calc(-0.224px * var(--ts)); color: var(--ink-48); display: flex; align-items: center; gap: var(--s-sm); }

/* 링크는 촘촘하게 봅니다. 버튼을 아래 줄에 따로 두면 카드 하나가 네 줄(약 125px)을
 * 잡아먹어 한 화면에 다섯 개밖에 안 들어갑니다. 제목 오른쪽으로 올려 절반으로 줄입니다. */
.lgrpbox .stack { gap: var(--s-xs); padding: var(--s-xs) var(--s-sm); }
/* .card는 좁은 화면 미디어쿼리에서 padding이 다시 잡힙니다(548행).
 * 그쪽이 뒤에 있어 .lnk 하나로는 못 이깁니다. .card.lnk로 특정도를 올립니다. */
.card.lnk { display: flex; align-items: center; gap: var(--s-xs); padding: 9px var(--s-sm) 9px var(--s-md); border-radius: 18px; }
/* 열기·수정은 기본이 최소 40px입니다(553행). 그대로 두면 카드가 그 높이에 묶입니다. */
.lnk .link.sm { min-height: 32px; padding: 6px 5px; }
.lnk__m { flex: 1; min-width: 0; }   /* min-width:0 이 없으면 긴 제목이 버튼을 화면 밖으로 밉니다 */
/* 한 줄로 고정합니다. 두 줄이 되면 카드가 20px씩 길어져 촘촘하게 만든 뜻이 없어집니다.
 * 잘린 메모는 '수정'에서 전부 보입니다. */
.lnk .ucard__t, .lnk .ucard__s { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lnk .ucard__t { font-size: calc(15px * var(--ts)); letter-spacing: calc(-0.3px * var(--ts)); }
.lnk .ucard__s { font-size: calc(13px * var(--ts)); letter-spacing: calc(-0.2px * var(--ts)); margin-top: 1px; }
.lnk__a { flex: none; display: flex; align-items: center; gap: var(--s-sm); }
.lnk__a .link.sm { font-size: calc(14px * var(--ts)); }
.ucard__t { font-size: calc(17px * var(--ts)); font-weight: 600; line-height: 1.24; letter-spacing: calc(-0.374px * var(--ts)); }
.ucard__s { font-size: calc(14px * var(--ts)); letter-spacing: calc(-0.224px * var(--ts)); color: var(--ink-48); margin-top: var(--s-xxs); }
.ucard__f { display: flex; align-items: center; gap: var(--s-md); margin-top: var(--s-sm); }

.empty { padding: var(--s-xxl) var(--s-lg); text-align: center; }
.empty__t { font-size: calc(21px * var(--ts)); font-weight: 600; letter-spacing: calc(0.231px * var(--ts)); }
.empty__s { font-size: calc(17px * var(--ts)); letter-spacing: calc(-0.374px * var(--ts)); color: var(--ink-48); margin-top: var(--s-xs); }

/* ── 떠 있는 유리 탭바 ── */
.tabbar {
  position: fixed; bottom: calc(12px + var(--sab)); z-index: 1150;
  left: 50%; transform: translateX(-50%);
  width: min(calc(100% - 24px), calc(var(--shell) - 24px));
  display: flex; gap: 2px; padding: 6px;
  border-radius: var(--r-pill);
  /* 상단바보다 한 단계 더 투명 — 아래로 지나가는 내용이 비칩니다 */
  background: linear-gradient(158deg, rgba(255,255,255,.24) 0%, rgba(255,255,255,.09) 50%, rgba(255,255,255,.20) 100%);
  backdrop-filter: blur(28px) saturate(150%) brightness(1.10);
  -webkit-backdrop-filter: blur(28px) saturate(150%) brightness(1.10);
  box-shadow:
    inset 0 1.4px 0 rgba(255,255,255,.95),
    inset 0 -1.4px 0 rgba(255,255,255,.42),
    inset 0 -16px 22px -16px rgba(255,255,255,.35),
    0 0 0 0.5px rgba(16,20,35,.10),
    0 14px 38px rgba(16,20,35,.20),
    0 3px 8px rgba(16,20,35,.08);
}
.tabbar button {
  flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px;
  padding: 8px 0 6px; color: var(--ink-48); min-height: 48px;
  border-radius: var(--r-pill); transition: background .2s, color .2s;
}
.tabbar button:active { transform: none; }
.tabbar span { font-size: calc(10px * var(--ts)); font-weight: 400; letter-spacing: calc(-0.08px * var(--ts)); }
.tabbar button.is-on {
  color: var(--primary);
  background: linear-gradient(160deg, rgba(255,255,255,.92), rgba(255,255,255,.72));
  border: 0.5px solid rgba(255,255,255,.8);
  box-shadow: inset 0 1px 0 rgba(255,255,255,1), 0 3px 10px rgba(16,20,35,.12);
}

/* ── 시트 ── */
.scrim {
  position: fixed; inset: 0; z-index: 1400;
  background: rgba(20,24,36,.36); backdrop-filter: blur(3px);
  display: flex; align-items: flex-end; justify-content: center;
  /* 키보드가 올라오면 그만큼 시트를 위로 올립니다 */
  padding: 0 var(--s-sm) calc(var(--s-sm) + var(--kb));
}
.sheet {
  width: 100%; max-width: calc(var(--shell) - 24px);
  /* --vvh는 visualViewport 높이라 이미 키보드가 빠져 있습니다.
     여기서 --kb를 또 빼면 값이 음수가 되어 시트가 찌그러집니다.
     (아이프레임 시절엔 --vvh가 안 줄어서 이중 차감이 드러나지 않았습니다) */
  max-height: min(88vh, calc(var(--vvh) - 24px));
  border-radius: var(--r-xl);
  display: flex; flex-direction: column; overflow: hidden;
  animation: rise .3s cubic-bezier(.22,.9,.28,1);
}
@keyframes rise { from { transform: translateY(28px); opacity: .5; } }
.sheet__h { display: flex; align-items: center; gap: var(--s-sm); padding: var(--s-md) var(--s-lg); border-bottom: 0.5px solid rgba(0,0,0,.07); }
.sheet__h h2 { flex: 1; font-size: calc(21px * var(--ts)); font-weight: 600; letter-spacing: calc(0.231px * var(--ts)); }
.sheet__b { padding: var(--s-md) var(--s-lg); overflow-y: auto; display: grid; gap: var(--s-md); }
.sheet__f { display: flex; align-items: center; gap: var(--s-sm); padding: var(--s-sm) var(--s-lg) var(--s-lg); border-top: 0.5px solid rgba(0,0,0,.07); }
.sheet__f .btn-primary { flex: 1; }
/* 둘 중 덜 중요한 쪽. 파랑 두 개가 나란히 있으면 무엇을 누를지 헷갈립니다. */
.btn-primary.btn-ghost { background: rgba(0,0,0,.05); color: var(--primary); box-shadow: none; }

.f label { display: block; font-size: calc(14px * var(--ts)); font-weight: 600; letter-spacing: calc(-0.224px * var(--ts)); color: var(--ink-80); margin-bottom: var(--s-xs); }
.f input, .f select, .f textarea {
  width: 100%; min-height: 46px; padding: 12px 18px;
  background: rgba(255,255,255,.62); color: var(--ink);
  border: 0.5px solid rgba(0,0,0,.10); border-radius: var(--r-md);
  /* 16px 미만이면 iOS가 포커스 시 화면을 확대해 버립니다 */
  font-size: max(16px, calc(17px * var(--ts)));
  letter-spacing: calc(-0.374px * var(--ts));
}
.f textarea { min-height: 100px; border-radius: var(--r-md); resize: vertical; line-height: 1.47; }
.f input:focus, .f select:focus, .f textarea:focus { border-color: var(--primary-focus); outline: none; background: var(--canvas); }
/* minmax(0,1fr)이어야 합니다. 그냥 1fr이면 칸이 콘텐츠보다 작아지지 못해
   "Day 1 · 9월 12일" 같은 긴 옵션이 옆 칸을 화면 밖으로 밀어냅니다. */
/* ── 여행 중 오늘 화면 ── */
.tday__day { font-size: calc(13px * var(--ts)); color: var(--ink-48); margin-bottom: 6px; }
.tday__hd {
  display: flex; align-items: baseline; gap: var(--s-xs);
  font-size: calc(17px * var(--ts)); font-weight: 600; letter-spacing: calc(-0.35px * var(--ts));
}
.tday__hd span { flex: 1; min-width: 0; }
.tday__hd time { font-size: calc(15px * var(--ts)); color: var(--primary); flex: none; }
.tday__warn {
  font-size: calc(13px * var(--ts)); line-height: 1.4; color: var(--k-food);
  margin-top: 5px; font-weight: 600;
}
.tday__l { margin-top: var(--s-sm); border-top: 0.5px solid rgba(0,0,0,.07); padding-top: var(--s-sm); }
.tday__i { display: flex; gap: var(--s-sm); padding: 7px 0; }
.tday__t {
  flex: none; width: 62px; font-size: calc(14px * var(--ts)); color: var(--ink-48);
  font-variant-numeric: tabular-nums;
}
.tday__tag {
  display: block; font-size: calc(10.5px * var(--ts)); font-weight: 700;
  color: var(--primary); letter-spacing: 0;
}
.tday__b { min-width: 0; flex: 1; }
.tday__n { font-size: calc(15px * var(--ts)); letter-spacing: calc(-0.3px * var(--ts)); }
.tday__c {
  display: flex; align-items: center; gap: 5px;
  font-size: calc(12.5px * var(--ts)); color: var(--ink-48); margin-top: 2px;
}
/* 지난 일정은 흐리게, 지금·다음은 또렷하게 — 색만이 아니라 굵기로도 구분합니다 */
.tday__i.is-done { opacity: .42; }
.tday__i.is-cur .tday__n { font-weight: 700; }
.tday__i.is-cur .tday__t, .tday__i.is-next .tday__t { color: var(--primary); }
.tday__i.is-next .tday__n { font-weight: 600; }
.tday__mv {
  font-size: calc(12.5px * var(--ts)); color: var(--ink-48);
  margin: 0 0 4px 74px; padding-left: 10px; border-left: 2px solid rgba(0,0,0,.10);
}
.tday__mv.is-tight { color: var(--k-food); border-left-color: var(--k-food); font-weight: 600; }

.f2 { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: var(--s-sm); }
.f2 > .f { min-width: 0; }
.f select { text-overflow: ellipsis; }

/* iOS의 네이티브 time/date 컨트롤은 자체 최소 너비를 갖고 있어서
   width:100%만으로는 칸 밖으로 삐져나옵니다. min-width를 풀고
   네이티브 외형을 꺼야 폭이 실제로 적용됩니다.
   한국어 로케일에서는 "오전 12:00"으로 표시돼 더 넓으므로 좌우 여백도 줄입니다.
   (font-size는 16px 이상을 유지해야 포커스 시 확대되지 않습니다) */
.f input[type="time"], .f input[type="date"] {
  min-width: 0; max-width: 100%;
  padding-left: 12px; padding-right: 12px;
  -webkit-appearance: none; appearance: none;
}

/* ── 가이드 ── */
/* overflow-x:hidden은 마지막 방어선입니다. 안에서 무엇이 넘치든
   대화창이 가로로 밀리지 않게 합니다(제안 카드·출처 링크도 마찬가지). */
.chat { flex: 1; overflow-y: auto; overflow-x: hidden; padding: var(--s-md) var(--s-lg); display: flex; flex-direction: column; gap: var(--s-sm); }
/* min-width:0이 없으면 flex 항목이 내용보다 작아지지 않습니다.
   URL처럼 띄어쓰기 없는 긴 글자가 오면 말풍선이 화면 밖으로 밀려나 화면 전체가 어긋납니다.
   overflow-wrap:anywhere로 어디서든 끊어 줄을 바꿉니다. */
.bub { max-width: 86%; min-width: 0; overflow-wrap: anywhere; word-break: break-word;
  padding: var(--s-sm) 16px; font-size: calc(17px * var(--ts)); line-height: 1.47; letter-spacing: calc(-0.374px * var(--ts)); border-radius: var(--r-lg); }
.bub.ai { background: rgba(255,255,255,.72); border: 0.5px solid rgba(255,255,255,.8); align-self: flex-start; border-bottom-left-radius: var(--r-sm); }
.bub.me { background: var(--primary); color: var(--on-dark); align-self: flex-end; border-bottom-right-radius: var(--r-sm); box-shadow: 0 2px 10px rgba(0,102,204,.26); }
.sug { background: rgba(255,255,255,.72); border: 0.5px solid rgba(255,255,255,.8); border-radius: var(--r-md); padding: var(--s-md); margin-top: var(--s-sm); }
.sug__m { font-size: calc(14px * var(--ts)); letter-spacing: calc(-0.224px * var(--ts)); color: var(--ink-48); margin-bottom: var(--s-sm); line-height: 1.43; }
.sug__m b { font-size: calc(17px * var(--ts)); font-weight: 600; letter-spacing: calc(-0.374px * var(--ts)); color: var(--ink); }
.chat__f { display: flex; gap: var(--s-xs); padding: var(--s-sm) var(--s-lg) var(--s-lg); border-top: 0.5px solid rgba(0,0,0,.07); }
.chat__f input {
  flex: 1; min-height: 46px; padding: 12px 18px;
  background: rgba(255,255,255,.62); border: 0.5px solid rgba(0,0,0,.10);
  border-radius: var(--r-pill);
  font-size: max(16px, calc(17px * var(--ts)));
  letter-spacing: calc(-0.374px * var(--ts));
}

.toast {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(90px + var(--sab)); z-index: 1500;
  background: rgba(29,29,31,.88); backdrop-filter: blur(14px); color: var(--on-dark);
  font-size: calc(15px * var(--ts)); letter-spacing: calc(-0.3px * var(--ts)); padding: 11px 22px; border-radius: var(--r-pill);
  box-shadow: var(--lift-2);
}
.boot { display: grid; place-items: center; gap: var(--s-sm); height: 60vh; }
.boot__b { width: 84px; height: 3px; border-radius: var(--r-pill); background: rgba(0,0,0,.08); position: relative; overflow: hidden; }
.boot__b::after { content: ""; position: absolute; inset: 0; width: 36%; border-radius: var(--r-pill); background: var(--primary); animation: slide 1.05s ease-in-out infinite; }
@keyframes slide { 0% { left: -36%; } 100% { left: 100%; } }
.boot span { font-size: calc(15px * var(--ts)); letter-spacing: calc(-0.3px * var(--ts)); color: var(--ink-48); }

@media (max-width: 419px) {
  .hero__h, .now__h { font-size: calc(28px * var(--ts)); }
  .hero img { height: 320px; }
  .card { padding: var(--s-md); }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* 텍스트 링크가 버튼으로 쓰일 때 터치 영역 확보 (44px 최소 규칙) */
button.link, button.link-quiet, a.link { padding: 9px 0; min-height: 40px; display: inline-flex; align-items: center; }
.dacts a.link, .dacts button.link, .dacts button.link-quiet { padding: 10px 0; }


/* ── 글자 크기 설정 ── */
.seg { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--s-xs); }
.seg button {
  padding: 14px 4px; border-radius: var(--r-md);
  background: rgba(255,255,255,.55); border: 0.5px solid rgba(0,0,0,.09);
  color: var(--ink-80); line-height: 1.2;
}
.seg button.is-on { background: var(--primary); color: var(--on-dark); border-color: transparent; font-weight: 600; }
.seg b { display: block; font-weight: 600; }
.seg small { display: block; font-size: calc(11px * var(--ts)); letter-spacing: calc(-0.1px * var(--ts)); opacity: .72; margin-top: 3px; }
.sample {
  padding: var(--s-md); border-radius: var(--r-md);
  background: rgba(255,255,255,.55); border: 0.5px solid rgba(0,0,0,.08);
}
.sample__t { font-size: calc(17px * var(--ts)); font-weight: 600; letter-spacing: calc(-0.374px * var(--ts)); }
.sample__s { font-size: calc(14px * var(--ts)); letter-spacing: calc(-0.224px * var(--ts)); color: var(--ink-48); margin-top: 4px; }

/* 글자를 키웠을 때 줄바꿈으로 흡수 (가로 스크롤 방지) */
.dayhd { flex-wrap: wrap; }
.dayhd__d { min-width: 0; }
.dline span { flex: 1; min-width: 0; }
.ev__ttl, .ev__sub, .crow__t, .crow__s, .ucard__t { overflow-wrap: anywhere; }
.facts { flex-wrap: nowrap; }
.card, .tlcard, .stack { min-width: 0; }


/* ── 어두운 사진 위에 있을 때의 상단바 ──
   흰 글자로 바꾸면 유리를 훨씬 투명하게 둘 수 있습니다 */
.topbar.on-dark {
  background: linear-gradient(158deg, rgba(18,20,28,.30) 0%, rgba(18,20,28,.16) 52%, rgba(18,20,28,.26) 100%);
  backdrop-filter: blur(24px) saturate(180%) brightness(.94);
  -webkit-backdrop-filter: blur(24px) saturate(180%) brightness(.94);
  border-color: rgba(255,255,255,.26);
  box-shadow:
    inset 0 1.2px 0 rgba(255,255,255,.34),
    inset 0 -1px 0 rgba(255,255,255,.12),
    0 10px 30px rgba(0,0,0,.22);
}
.topbar.on-dark .gbtn { color: #fff; }
.topbar.on-dark .gbtn:active { background: rgba(255,255,255,.16); }
.topbar.on-dark::after {
  box-shadow:
    inset 0 0 0 0.5px rgba(255,255,255,.30),
    inset 0 3px 8px -4px rgba(255,255,255,.34),
    inset 0 -10px 18px -12px rgba(255,255,255,.16);
}
.topbar.on-dark::before { background: linear-gradient(to bottom, rgba(255,255,255,.16), rgba(255,255,255,0)); }
.topbar { transition: background .25s, border-color .25s, box-shadow .25s; }
.gbtn { transition: color .25s; }


/* 목록에서 분류를 알아보게 하는 점 */
.cdot {
  display: inline-block; width: 8px; height: 8px; border-radius: var(--r-pill);
  margin-right: 7px; vertical-align: baseline; flex: none;
}
.crow__s, .ev__sub { display: flex; align-items: center; }
.ev__sub .cdot { margin-top: 0; }


/* ── 키보드가 올라왔을 때 ──
   iOS는 키보드가 떠도 레이아웃 높이를 줄이지 않아서
   시트가 그대로 남아 위쪽이 화면 밖으로 밀립니다. */
.sheet--tall { height: min(84vh, calc(var(--vvh) - 24px)); }
body.kb .sheet {
  max-height: min(52vh, calc(var(--vvh) - 16px));
}
body.kb .sheet--tall { height: min(52vh, calc(var(--vvh) - 16px)); }
body.kb .chat { min-height: 80px; }


/* ── AI 제안 카드 ── */
.acts { display: grid; gap: var(--s-xs); margin-top: var(--s-sm); }
.act {
  background: rgba(255,255,255,.74); border: 0.5px solid rgba(255,255,255,.88);
  border-radius: var(--r-md); padding: 14px;
}
.act.is-busy { opacity: .5; pointer-events: none; }
.act.is-done { opacity: .6; }
.act.is-done .act__f { display: none; }
.act__hd { display: flex; align-items: center; gap: var(--s-xs); margin-bottom: 5px; }
.act__tag {
  font-size: calc(11px * var(--ts)); font-weight: 600; letter-spacing: calc(-0.1px * var(--ts));
  padding: 3px 9px; border-radius: var(--r-pill); flex: none;
}
.act__tag.t-add { background: rgba(0,102,204,.12);  color: var(--primary); }
.act__tag.t-edit{ background: rgba(134,100,64,.16); color: var(--k-cafe); }
.act__tag.t-del { background: rgba(176,74,124,.14); color: var(--k-shop); }
.act__t { font-size: calc(16px * var(--ts)); font-weight: 600; letter-spacing: calc(-0.35px * var(--ts)); min-width: 0; }
.act__m { display: flex; align-items: center; font-size: calc(13px * var(--ts)); color: var(--ink-48); }
.act__old { font-size: calc(13px * var(--ts)); color: var(--ink-48); text-decoration: line-through; margin-top: 2px; }
.act__why { font-size: calc(13px * var(--ts)); line-height: 1.45; color: var(--ink-80); margin-top: 7px; }
.act__warn { font-size: calc(12.5px * var(--ts)); line-height: 1.4; color: var(--k-food); margin-top: 7px; }
.act__f { display: flex; align-items: center; gap: var(--s-sm); margin-top: 11px; }
.act__done { font-size: calc(13px * var(--ts)); font-weight: 600; color: var(--k-see); margin-top: 9px; }
.act__all { width: 100%; margin-top: var(--s-xxs); }

/* 빠른 질문 */
.qchips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: var(--s-sm); }
.qchip {
  padding: 9px 15px; border-radius: var(--r-pill);
  background: rgba(255,255,255,.72); border: 0.5px solid rgba(255,255,255,.86);
  font-size: calc(14px * var(--ts)); letter-spacing: calc(-0.22px * var(--ts)); color: var(--ink-80);
}
.chat__f button:disabled { opacity: .45; }


/* 시트가 열려 있는 동안 뒤 화면이 따라 움직이지 않게 */
body.locked { position: fixed; width: 100%; overflow: hidden; }


/* AI 검색 출처 */
.srcs { display: flex; flex-wrap: wrap; gap: 5px; margin-top: var(--s-xs); }
.src {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 5px 11px; border-radius: var(--r-pill);
  background: rgba(255,255,255,.6); border: 0.5px solid rgba(255,255,255,.8);
  font-size: calc(12px * var(--ts)); letter-spacing: calc(-0.12px * var(--ts)); color: var(--ink-48);
  max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.src::before { content: ""; width: 5px; height: 5px; border-radius: var(--r-pill); background: var(--primary); flex: none; }
#aiLoc.is-on { color: var(--primary); background: rgba(0,102,204,.10); }
.typing { display: inline-flex; gap: 4px; align-items: center; }
.typing i { width: 6px; height: 6px; border-radius: var(--r-pill); background: var(--ink-48); animation: blink 1.1s infinite; }
.typing i:nth-child(2){ animation-delay:.18s } .typing i:nth-child(3){ animation-delay:.36s }
@keyframes blink { 0%,60%,100%{opacity:.25} 30%{opacity:1} }


/* ── 예약: 카드 한 줄 ── */
.bkcard {
  display: flex; align-items: center; gap: var(--s-sm);
  width: 100%; text-align: left; padding: var(--s-md) var(--s-lg);
}
.bkcard:active { transform: scale(0.99); }
.bkcard__ic { display: flex; align-items: center; }
.bkcard__ic .bkcard__i + .bkcard__i { margin-left: -10px; }
.bkcard__i {
  width: 36px; height: 36px; border-radius: var(--r-pill);
  display: grid; place-items: center; flex: none;
  color: var(--primary); background: rgba(0,102,204,.12);
  border: 1.5px solid var(--canvas);
}
.bkcard__i.stay { color: var(--k-stay); background: rgba(113,84,160,.14); }
.bkcard__i.food { color: var(--k-food); background: rgba(182,87,36,.14); }
.bkcard__i.tick { color: var(--k-see);  background: rgba(44,125,88,.14); }
.bkcard__i.etc  { color: var(--ink-48); background: rgba(0,0,0,.06); }
.bkcard__i.add  { color: var(--ink-48); background: none; border: 1px dashed var(--hairline); }
.bkcard__b { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.bkcard__t { font-size: calc(17px * var(--ts)); font-weight: 600; letter-spacing: calc(-0.37px * var(--ts)); }
.bkcard__s {
  font-size: calc(13px * var(--ts)); letter-spacing: calc(-0.2px * var(--ts));
  color: var(--ink-48); margin-top: 2px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.bkcard__c { color: var(--ink-48); flex: none; }

/* 예약 목록 */
button.dt__row { width: 100%; text-align: left; }
button.dt__row:active { transform: scale(0.98); }
.dt__g {
  font-size: calc(13px * var(--ts)); font-weight: 600; color: var(--ink-48);
  padding: var(--s-xs) 2px 2px;
}

/* 상세 시트의 복사 가능한 줄 */
.dt { display: grid; gap: var(--s-xs); }
.dt__row {
  display: flex; align-items: center; gap: var(--s-sm);
  padding: 12px 14px; border-radius: var(--r-md);
  background: rgba(255,255,255,.6); border: 0.5px solid rgba(255,255,255,.8);
}
.dt__k { font-size: calc(13px * var(--ts)); color: var(--ink-48); width: calc(62px * var(--ts)); flex: none; }
.dt__v { flex: 1; min-width: 0; font-size: calc(16px * var(--ts)); font-weight: 500; overflow-wrap: anywhere; }
.dt__v.ref { font-weight: 700; letter-spacing: 0.06em; }
.dt__a { font-size: calc(13px * var(--ts)); font-weight: 600; color: var(--primary); flex: none; }


/* ── 사진 첨부 ── */
.shot { position: relative; margin: 0 var(--s-lg) var(--s-xs); align-self: flex-start; }
.shot img { height: 74px; border-radius: var(--r-md); display: block; border: 0.5px solid rgba(255,255,255,.8); }
.shot__x {
  position: absolute; top: -6px; right: -6px;
  width: 24px; height: 24px; border-radius: var(--r-pill);
  background: var(--ink); color: #fff; font-size: 12px; line-height: 1;
  display: grid; place-items: center;
}
.bub img.sent { max-width: 190px; border-radius: var(--r-md); display: block; margin-bottom: 7px; }
.act__amt { font-size: calc(17px * var(--ts)); font-weight: 700; letter-spacing: calc(-0.35px * var(--ts)); }
.act__tag.t-exp { background: rgba(182,87,36,.14); color: var(--k-food); }
.act__tag.t-cand { background: rgba(52,120,86,.14); color: var(--k-see); }
/* 후보 카드 — 링크와 같은 이유로 촘촘하게 봅니다.
 * .card는 좁은 화면 미디어쿼리에서 padding이 다시 잡히므로 .card.cnd로 특정도를 올리고,
 * 버튼은 기본 min-height 40px에 카드 높이가 묶이지 않게 낮춥니다. */
.card.cnd { padding: 10px var(--s-md); border-radius: 18px; }
.cnd .ucard__t { font-size: calc(15px * var(--ts)); letter-spacing: calc(-0.3px * var(--ts)); }
.cnd .ucard__s { font-size: calc(13px * var(--ts)); margin-top: 1px; }
.cnd .ucard__f { margin-top: 4px; gap: var(--s-md); }
/* 버튼에 붙는 margin-top 12px가 줄 높이를 28 → 40으로 늘립니다 */
.cnd .link.sm { min-height: 28px; padding: 4px 0; font-size: calc(14px * var(--ts)); margin: 0; }
/* 빈 시간 제안 */
.fitbox { margin-bottom: var(--s-md); }
.fit__h { font-size: calc(13px * var(--ts)); font-weight: 600; color: var(--ink-48); margin-bottom: var(--s-xs); }
.fit { background: rgba(0,102,204,.06); border-radius: 16px; padding: 10px var(--s-md); margin-bottom: var(--s-xs); }
.fit__t { font-size: calc(15px * var(--ts)); font-weight: 600; letter-spacing: calc(-0.3px * var(--ts)); }
.fit__s { font-size: calc(12px * var(--ts)); color: var(--ink-48); margin-top: 1px; }
.fit .link.sm { min-height: 28px; padding: 4px 0; margin: 4px 0 0; font-size: calc(14px * var(--ts)); }
/* 삭제는 오른쪽 끝에 떼어놓습니다. 옆 버튼과 붙으면 잘못 누릅니다. */
/* button.link-quiet(min-height 40px)를 이기려면 클래스 둘이 필요합니다 */
.cnd .cnd__del { margin-left: auto; min-height: 28px; padding: 4px 0; font-size: calc(14px * var(--ts)); }
.cnd__s { display: flex; align-items: center; gap: 5px; margin-top: 2px;
  font-size: calc(12px * var(--ts)); color: var(--ink-48); }


/* ── 챗봇 입력줄 정리 ── */
.chat__f { align-items: center; }
.chat__f .gbtn { flex: none; width: 38px; height: 38px; }
.chat__f input { flex: 1; min-width: 0; }
.chat__f .send {
  flex: none; width: 46px; height: 46px; border-radius: var(--r-pill);
  background: var(--primary); color: var(--on-dark);
  display: grid; place-items: center;
  box-shadow: 0 2px 10px rgba(0,102,204,.28);
}
.chat__f .send:disabled { opacity: .4; box-shadow: none; }
.chat__f .send svg { margin-left: -1px; }

/* ── 빠른 질문: 말풍선 밖으로 빼서 폭을 다 쓰게 ── */
.qchips {
  display: flex; flex-wrap: wrap; gap: 6px;
  margin: 2px 0 0; align-self: stretch;
}
.qchip {
  padding: 9px 14px; border-radius: var(--r-pill);
  background: rgba(255,255,255,.72); border: 0.5px solid rgba(255,255,255,.86);
  font-size: calc(14px * var(--ts)); letter-spacing: calc(-0.22px * var(--ts));
  color: var(--ink-80); white-space: nowrap;
}
.qchip:active { background: rgba(255,255,255,.92); }


/* 좁은 화면에서 입력 폭 확보 */
@media (max-width: 400px) {
  .chat__f { gap: 6px; padding-left: var(--s-sm); padding-right: var(--s-sm); }
  .chat__f .gbtn { width: 34px; height: 34px; }
  .chat__f .send { width: 44px; height: 44px; }
  .qchip { padding: 8px 13px; }
}

.cachetag { font-size: calc(12px * var(--ts)); color: var(--ink-48); margin-top: 6px; }


/* 지출: 통화 표기 */
.total__sub { font-size: calc(14px * var(--ts)); color: var(--ink-48); margin-top: 6px; }
.crow__n b.krw { color: var(--ink); }


/* 주소 찾기 결과 안내 */
.findnote {
  margin-top: 6px; padding: 10px 12px; border-radius: var(--r-sm);
  background: rgba(255,255,255,.6); border: 0.5px solid rgba(255,255,255,.8);
  font-size: calc(13px * var(--ts)); line-height: 1.45; color: var(--ink-80);
}
.findnote b { font-weight: 600; }
.findnote.err { color: var(--k-shop); }


/* 지도 핀 옆 한국어 이름 */
.leaflet-tooltip.pinlab {
  background: rgba(255,255,255,.94);
  border: 0.5px solid rgba(0,0,0,.10);
  border-radius: var(--r-sm);
  padding: 3px 8px;
  font-family: var(--sf);
  font-size: calc(12px * var(--ts));
  font-weight: 600;
  letter-spacing: calc(-0.15px * var(--ts));
  color: var(--ink);
  box-shadow: 0 1px 5px rgba(16,20,35,.16);
  white-space: nowrap;
}
.leaflet-tooltip.pinlab::before { display: none; }


/* ── 일정 검토 결과 ── */
.findings { margin-top: var(--s-sm); }
.fhd {
  display: flex; align-items: center; gap: var(--s-xs);
  font-size: calc(13px * var(--ts)); font-weight: 600; color: var(--ink-48);
  margin-bottom: var(--s-xs);
}
.fitem {
  display: flex; gap: var(--s-xs); align-items: flex-start;
  padding: 9px 12px; margin-bottom: 5px; border-radius: var(--r-sm);
  background: rgba(255,255,255,.6); border: 0.5px solid rgba(255,255,255,.8);
  font-size: calc(13px * var(--ts)); line-height: 1.45; color: var(--ink-80);
}
.fbadge {
  flex: none; font-size: calc(11px * var(--ts)); font-weight: 600;
  padding: 2px 7px; border-radius: var(--r-pill); margin-top: 1px;
}
.fbadge.l3 { background: rgba(182,87,36,.16); color: var(--k-food); }
.fbadge.l2 { background: rgba(176,74,124,.14); color: var(--k-shop); }
.fbadge.l1 { background: rgba(0,0,0,.06);      color: var(--ink-48); }
.fmore { font-size: calc(13px * var(--ts)); color: var(--primary); margin-top: 2px; }


/* ── 준비물 체크리스트 ── */
.sechd {
  display: flex; align-items: baseline; gap: var(--s-xs);
  padding: var(--s-lg) var(--s-lg) var(--s-xs);
}
.sechd h3 { flex: 1; font-size: calc(21px * var(--ts)); font-weight: 600; letter-spacing: calc(0.23px * var(--ts)); }
.sechd__n { font-size: calc(14px * var(--ts)); color: var(--ink-48); }

/* 제목을 눌러 접고 폅니다. 화살표만 누르게 하면 표적이 너무 작습니다 */
.sechd__b {
  display: flex; align-items: baseline; gap: var(--s-xs);
  flex: 1; min-width: 0; min-height: 44px; color: var(--ink);
}
.sechd__b h3 { flex: 1; }
.sechd__c { flex: none; color: var(--ink-48); transform: rotate(90deg); transition: transform .2s; }
.sechd__b[aria-expanded="false"] .sechd__c { transform: rotate(0deg); }
.sec.is-folded > .secbody { display: none; }

/* 링크 순서 바꾸기 — 꾹 눌러 끌기
 * iOS는 길게 누르면 텍스트 선택 메뉴(선택·복사·조회)를 먼저 띄우고 pointercancel을 보냅니다.
 * 그게 끌기가 켜지는 순간 드래그를 죽이므로, 카드에서는 처음부터 꺼둬야 합니다.
 * body에 클래스를 거는 방식은 420ms 뒤라서 늦습니다. */
.lnk, .lgroup {
  transition: box-shadow .16s, transform .12s, opacity .16s;
  -webkit-touch-callout: none;
  -webkit-user-select: none; user-select: none;
  touch-action: pan-y;                          /* 세로 스크롤은 살리고 가로 흔들림은 무시 */
}
.lnk a, .lnk button { -webkit-touch-callout: none; }
.lnk.is-drag, .lgrpbox.is-drag {
  opacity: .95; transform: scale(1.02);
  box-shadow: 0 12px 30px rgba(0,0,0,.22);
  position: relative; z-index: 5;
}
.lgrpbox.is-drag { border-radius: var(--r-lg); background: var(--canvas); }
.lnk.is-drag *, .lgrpbox.is-drag * { pointer-events: none; }   /* 끌던 중 링크가 열리지 않게 */
body.lndrag { user-select: none; -webkit-user-select: none; }
body.lndrag .lnk, body.lndrag .lgroup { touch-action: none; }
/* 순서 버튼 — 제스처가 안 먹는 상황에서도 확실히 바꿀 수 있는 길 */
.lord { margin-left: auto; display: flex; gap: 0; }
.lord button {
  width: 30px; height: 32px; display: grid; place-items: center;
  border: 0; background: none; color: var(--ink-48); border-radius: var(--r-sm);
}
.lord button:disabled { opacity: .25; }
.lhint { margin: 10px 2px 0; font-size: calc(12px * var(--ts)); color: var(--ink-48); }

.pbar { height: 5px; border-radius: var(--r-pill); background: rgba(0,0,0,.07); margin: 0 var(--s-lg) var(--s-xs); overflow: hidden; }
.pbar i { display: block; height: 100%; border-radius: var(--r-pill); background: var(--primary); transition: width .3s; }

.pgrp { padding: var(--s-sm) var(--s-lg) 2px; font-size: calc(13px * var(--ts)); font-weight: 600; color: var(--ink-48); }
.pk { display: flex; align-items: center; gap: var(--s-sm); padding: 11px var(--s-lg); border-top: 0.5px solid rgba(0,0,0,.06); }
.pk:first-of-type { border-top: none; }
.pkbox {
  width: 24px; height: 24px; flex: none; border-radius: var(--r-sm);
  border: 1.5px solid var(--ink-48); background: rgba(255,255,255,.6);
  display: grid; place-items: center; padding: 0;
}
.pkbox[aria-checked="true"] { background: var(--primary); border-color: var(--primary); }
.pkbox svg { opacity: 0; }
.pkbox[aria-checked="true"] svg { opacity: 1; }
.pk__t { flex: 1; min-width: 0; font-size: calc(16px * var(--ts)); letter-spacing: calc(-0.3px * var(--ts)); overflow-wrap: anywhere; }
.pk.is-done .pk__t { color: var(--ink-48); text-decoration: line-through; }
.pk__who { font-size: calc(13px * var(--ts)); color: var(--ink-48); flex: none; }
.pk__e { color: var(--ink-48); flex: none; padding: 4px; }


/* ── AI가 언급한 장소 — 눌러서 직접 확인 ── */
.places { display: grid; gap: 5px; margin-top: var(--s-xs); }
.place {
  display: flex; align-items: center; gap: var(--s-xs);
  padding: 8px 12px; border-radius: var(--r-sm);
  background: rgba(255,255,255,.6); border: 0.5px solid rgba(255,255,255,.8);
}
.place__n {
  flex: 1; min-width: 0;
  font-size: calc(14px * var(--ts)); font-weight: 600; letter-spacing: calc(-0.22px * var(--ts));
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.place__a {
  flex: none; font-size: calc(13px * var(--ts)); font-weight: 600;
  color: var(--primary); padding: 3px 2px;
}
.place__a.tbl { color: var(--k-food); }

<body>

<div class="shell">

  <!-- 왼쪽 알약: 일정 탭에서만 보입니다. 후보는 곁다리라 목록을 펼쳐두지 않고
       눌렀을 때 시트로 엽니다. 일정 탭의 본론은 일정입니다. -->
  <nav class="topbar topbar--l glass" id="tbCand" hidden>

  <!-- 홈 -->
  <section class="view is-on" id="v-home">

      <div class="hero__scrim"></div>

    </div>

    <div id="todaySlot"></div>

  </section>

  <!-- 일정 -->
  <section class="view" id="v-plan">
    <div class="mapcard"><div id="map"></div></div>

    <div class="chiprow" id="chipCatRow"><div class="chips glass" id="chipCat"></div></div>
    <div id="timeline"></div>
  </section>

  <!-- 지출 -->
  <section class="view" id="v-cost">
    <div class="stack"><div class="card glass">
      <div class="ty-caption-st muted-80">총 지출</div>

 *    기존 코드가 기대하던 반환값(data)만 resolve 합니다.
 */
/* 응답이 없으면 언제까지 기다릴지. 비행기모드에서 fetch가 거부되지 않고
 * 매달리는 경우가 있는데, 그러면 부팅 화면에서 영영 안 넘어갑니다(흰 화면처럼 보입니다).
 * Apps Script 저장이 6초대라 넉넉히 잡되 무한정 기다리지는 않습니다.
 * AI 답변은 이보다 오래 걸리므로 따로 넉넉히 줍니다. */
function apiTimeout(fn){
  return (fn === 'chatAI' || fn === 'reviewPlan' || fn === 'lookupPlace') ? 90000 : 25000;
}

function api(fn){
  var args=[].slice.call(arguments,1);
  var ac = (typeof AbortController !== 'undefined') ? new AbortController() : null;
  var timer = setTimeout(function(){ if(ac) ac.abort(); }, apiTimeout(fn));

  var opt = {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ fn: fn, args: args, token: API_TOKEN })
  };
  if(ac) opt.signal = ac.signal;

  return fetch(EXEC, opt).then(function(r){
    clearTimeout(timer); return r.json();
  }, function(){
    clearTimeout(timer);
    // 두 번째 인자로 둬야 '통신 실패'만 여기로 옵니다.
    // 서버가 거부한 경우(아래 throw)는 이 자리에 걸리지 않습니다.
    // 이 구분이 없으면 서버가 거절한 요청까지 큐에 쌓여 영원히 재시도합니다.
    var e = new Error('연결할 수 없습니다'); e.net = true; throw e;
  }).then(function(res){
    if(res && res.ok) return res.data;
    throw new Error((res && res.error) || '서버 오류');
  });
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function nice(s){ return String(s==null?'':s).replace(/\s*\u27A1\uFE0F?\s*/g,' \u2192 ').replace(/\s{2,}/g,' ').trim(); }
function safeUrl(u){ var s=String(u||'').trim(); return /^https?:\/\//i.test(s)?s:''; }
function toMin(t){ var m=String(t||'').match(/^(\d{1,2}):(\d{2})/); return m? +m[1]*60 + +m[2] : 9999; }
function byTime(a,b){ var d=+a.day-+b.day; return d || toMin(a.time)-toMin(b.time); }
function yen(n){ return '¥ '+Math.round(n).toLocaleString('ko-KR'); }
function krw(n){ return Math.round(n*rate).toLocaleString('ko-KR')+'원'; }
function toast(m){ var t=$('toast'); t.textContent=m; t.hidden=false;
  clearTimeout(toast._t); toast._t=setTimeout(function(){ t.hidden=true; },2200); }

var WD=['일','월','화','수','목','금','토'];
function dayDate(n){
  var m=String(S.trip.startDate||'').match(/(\d{4})-(\d{1,2})-(\d{1,2})/); if(!m) return null;
  var d=new Date(+m[1],+m[2]-1,+m[3]); d.setDate(d.getDate()+(+n-1)); return d;
}
function fmtD(d){ return (d.getMonth()+1)+'월 '+d.getDate()+'일 '+WD[d.getDay()]+'요일'; }
function fmtDs(d){ return (d.getMonth()+1)+'월 '+d.getDate()+'일'; }
function totalDays(){ var n=+S.trip.days||0; S.plan.forEach(function(p){ n=Math.max(n,+p.day||0); }); return Math.max(n,1); }
function todayDay(){
  var s=dayDate(1); if(!s) return 0;
  var now=new Date(); now.setHours(0,0,0,0); s.setHours(0,0,0,0);
  var diff=Math.round((now-s)/86400000);
  if(diff<0) return 0;
  return diff+1<=totalDays()? diff+1 : -1;
}

/* ═══════════ 메모 해석 ═══════════ */
function splitParts(s){
  var raw=String(s).split(/\s+\/\s+/), out=[], buf='', depth=0;
  raw.forEach(function(piece){
    buf = buf ? buf+' / '+piece : piece;
    depth += (piece.match(/[(\[]/g)||[]).length - (piece.match(/[)\]]/g)||[]).length;
    if(depth<=0){ out.push(buf); buf=''; depth=0; }
  });
  if(buf) out.push(buf);
  return out;
}
function parseMemo(memo){
  var out={ move:'', cost:'', notes:[] };
  if(!memo) return out;
  splitParts(memo).forEach(function(part){
    var s=part.replace(/^[^\uAC00-\uD7A3A-Za-z0-9(\[]+/,'').trim();
    if(!s) return;
    var m=s.match(/^([^:：]{1,16})\s*[:：]\s*([\s\S]+)$/);
    if(m){
      var k=m[1].replace(/\s/g,'');
      if(/이동|가는법/.test(k) && !/비|요금|가격/.test(k)){ out.move = out.move? out.move+' · '+m[2] : m[2]; return; }
      if(/가격|비용|요금|교통비|입장료|점심|디저트|간식|커피|음료/.test(k)){ out.cost = out.cost? out.cost+' · '+m[2] : m[2]; return; }
    }
    out.notes.push(s);
  });
  return out;
}

/* ═══════════ 부팅 ═══════════ */
function paint(id, name, size){ var e=$(id); if(e) e.innerHTML=ico(name, size); }

/* 부팅은 DOM만 준비되면 시작합니다.
 * 예전에는 window.onload(=이미지까지 전부 받은 뒤)에 걸려 있었습니다.
 * 히어로 사진이 Unsplash에서 오는데 오프라인이면 그 요청이 1분쯤 매달리고,
 * 그동안 앱 코드가 시작조차 못 해 흰 화면이었습니다. 사진은 늦게 와도 됩니다. */
/* 부팅이 어디서 느려지는지 남깁니다. 오프라인에서는 개발자 도구를 못 붙이니
 * 설정 화면에서 숫자로 확인합니다. navigationStart부터의 경과 시간(ms)입니다. */
var TMARK = {};
function tmark(k){
  try { TMARK[k] = Math.round(performance.now()); } catch(e){}
}
function tmarkText(){
  return Object.keys(TMARK).map(function(k){ return k+' '+TMARK[k]+'ms'; }).join(' · ') || '측정 없음';
}
tmark('스크립트');

     그래서 오프라인에서도 기다림 없이 바로 보여야 합니다.
     여기서 오류를 삼키면 안 됩니다. apply는 시작하자마자 '불러오는 중'을 숨기므로,
     그 뒤에 터지면 아무것도 없는 흰 화면이 되고 이유도 알 수 없습니다. */

/* ═══════════ 오프라인 캐시 ═══════════
   마지막으로 받은 전체 상태를 기기에 저장해 둡니다.
   - 앱을 열면 캐시를 먼저 그려서 즉시 화면이 뜨고(서버 응답은 3초 넘게 걸립니다)
   - 통신이 안 되면 캐시로 계속 볼 수 있습니다. 여행지에서 이게 핵심입니다.
   아이프레임 시절에는 iOS가 저장소를 지워서 못 쓰던 방법입니다(HANDOFF 3장). */
var CACHE_KEY = 'tripai.state.v1';
function saveCache(d){
  try { localStorage.setItem(CACHE_KEY, JSON.stringify({ at: Date.now(), data: d })); }
  catch(e){ /* 용량 초과 등은 조용히 넘깁니다. 캐시는 있으면 좋은 것일 뿐입니다 */ }
}
function readCache(){
  try {
    var r = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null');
    return (r && r.data && r.data.trip) ? r : null;
  } catch(e){ return null; }
}
/* ── 오프라인 쓰기 큐 ──
   통신이 안 될 때의 저장을 쌓아뒀다가 연결되면 순서대로 올립니다.
   지하철이나 로밍이 끊긴 곳에서 지출을 넣는 상황이 실제로 자주 생깁니다.
   서버가 '거부'한 것은 큐에 넣지 않습니다. 넣으면 영원히 재시도하게 됩니다. */
var QUEUE_KEY = 'tripai.queue.v1', flushing = false;
function readQueue(){
  try { var q = JSON.parse(localStorage.getItem(QUEUE_KEY) || '[]'); return q instanceof Array ? q : []; }
  catch(e){ return []; }
}
function writeQueue(q){
  try { localStorage.setItem(QUEUE_KEY, JSON.stringify(q)); } catch(e){}
}
function enqueue(fn, rec){
  var q = readQueue();
  // 같은 항목을 여러 번 고치면 마지막 것만 남깁니다
  if(rec && rec.id) q = q.filter(function(it){ return !(it.fn === fn && it.rec && it.rec.id === rec.id); });
  q.push({ fn: fn, rec: rec, at: Date.now() });
  writeQueue(q);
  renderFacts();
}
function flushQueue(){
  if(flushing) return;
  var q = readQueue();
  if(!q.length) return;
  flushing = true;
  (function next(){
    var q2 = readQueue();
    if(!q2.length){ flushing = false; renderFacts(); return load(); }
    var it = q2[0];
    api(it.fn, it.rec).then(function(){
      writeQueue(readQueue().slice(1));
      next();
    }).catch(function(e){
      if(e && e.net){ flushing = false; return; }   // 아직 오프라인이면 그대로 둡니다
      // 서버가 거부한 것은 버립니다. 남겨두면 뒤의 것들이 영영 못 올라갑니다.
      writeQueue(readQueue().slice(1));
      toast('저장하지 못한 항목 1개를 건너뜁니다');
      next();
    });
  })();
}

function cacheAge(at){
  var m = Math.round((Date.now() - at) / 60000);
  if(m < 1) return '방금';
  if(m < 60) return m + '분 전';
  var h = Math.round(m/60);
  return h < 24 ? h + '시간 전' : Math.round(h/24) + '일 전';
}

/* 흰 화면 대신 무엇이 잘못됐는지 보여줍니다.
 * 오프라인처럼 개발자 도구를 못 붙이는 상황에서는 이게 유일한 단서입니다. */
function showFatal(what, err){
  var msg = (err && (err.message || err)) || '알 수 없는 오류';
  var where = String((err && err.stack) || '').split('\n')[1] || '';
  var el = document.getElementById('boot');
  if(!el) return;
  el.hidden = false;
  el.innerHTML =
    '<div class="empty"><div class="empty__t">' + esc(what) + '</div>' +
    '<div class="empty__s">' + esc(msg) + '<br><small>' + esc(where.trim().slice(0,120)) + '</small>' +
    '<br><br>이 문구를 그대로 알려주시면 고칠 수 있습니다.</div></div>';
}

/* 어디서든 터진 오류를 화면에 남깁니다. 아직 아무것도 못 그린 상태일 때만입니다 —
 * 이미 화면이 떠 있으면 굳이 덮지 않습니다. */
window.addEventListener('error', function(ev){
  var boot = document.getElementById('boot');
  if(boot && !boot.hidden && !boot.dataset.fatal){
    boot.dataset.fatal = '1';
    showFatal('화면을 여는 중 오류가 났습니다', ev.error || { message: ev.message });
  }
});

function load(){
  return api('getAll').then(function(d){ syncOk=true; apply(d); }).catch(function(e){
    var c = readCache();
    if(c){                       // 통신이 안 되면 마지막 내용으로 계속 씁니다
      syncOk=false;
      /* 예전에는 여기서 오류를 통째로 삼켰습니다. apply는 시작하자마자 '불러오는 중'을
         숨기기 때문에, 그 뒤에 터지면 아무것도 안 그려진 흰 화면이 됩니다.
         무엇이 터졌는지 화면에 보여줘야 고칠 수 있습니다. */
      try {
        apply(c.data);
      } catch(err){
        return showFatal('저장해둔 내용을 그리다가 멈췄습니다', err);
      }
      renderFacts();
      toast('오프라인 — ' + cacheAge(c.at) + ' 내용입니다');
      return;
    }
    $('boot').innerHTML='<div class="empty"><div class="empty__t">불러오지 못했습니다</div><div class="empty__s">'+esc(e.message||e)+'</div></div>';
  });
}
/* ═══════════ 일정 좌표 채우기 ═══════════
   좌표가 있어야 지도 핀과 이동 시간 계산(일정 검토)이 제대로 동작합니다.
   좌표가 없으면 36곳짜리 지역명 사전으로 대체되어, 긴자 안의 두 장소가
   거리 0으로 계산되는 식으로 검토가 무뎌집니다.
   한 곳당 lookupPlace가 AI를 1회 부르므로 없는 것만 골라 순서대로 처리하고,
   한도(429)에 걸리면 더 두드리지 않고 즉시 멈춥니다(HANDOFF 5장). */
var geoBusy=false, geoStop=false;

/* 좌표가 없는 것들. 일정과 후보를 한 목록으로 다룹니다 —
 * 버튼을 따로 두면 사용자가 두 번 눌러야 하고, 어느 쪽이 남았는지도 헷갈립니다.
 * kind는 저장할 때 어느 시트로 갈지 정하는 데 씁니다. */
function needCoord(){
  var out = (S.plan||[]).filter(function(p){ return !okCoord(p.lat, p.lng); })
    .map(function(p){ return { kind:'plan', id:p.id, title:p.title, ref:p }; });
  (S.candidate||[]).forEach(function(c){
    if(!okCoord(c.lat, c.lng)) out.push({ kind:'cand', id:c.id, title:c.title, ref:c });
  });
  return out;
}

/* lookupPlace는 '장소 이름'을 기대하는데 일정 제목은 그렇지 않은 게 많습니다.
 * "렘플러스 긴자 ➡️ 시부야 이동"은 두 지점이고 "아키하바라 쇼핑 & 점심"은 할 일입니다.
 * 그래서 제목에서 찾을 만한 이름을 뽑아 넓혀가며 시도합니다.
 * 이동 줄은 도착지를 씁니다. 그 일정이 끝났을 때 서 있는 자리가 도착지이고,
 * 이동 시간 계산도 앞 장소→도착지가 맞는 구간입니다. */
function geoQueries(title){
  var t = String(title||'').replace(/[➡→⇒]️?|->/g, '>').replace(/\s+/g,' ').trim();
  var out = [];
  function add(s){
    s = String(s||'').replace(/\s+/g,' ').trim();
    if(s && out.indexOf(s) < 0) out.push(s);
  }
  var main = t.indexOf('>') !== -1 ? t.split('>').pop() : t;   // 도착지 또는 제목 전체
  add(main.replace(/\s*이동\s*$/, ''));
  if(t.indexOf('>') === -1) add(t);

  // 할 일을 걷어내고 남는 이름 → 그래도 안 되면 지역 이름 하나
  var base = main.split(/[&/·]/)[0]
    .replace(/(쇼핑|점심|저녁|아침|브런치|산책|구경|관람|성지\s*순례|픽업|라스트|체크인|체크아웃|이동|출발|도착|입국|출국)/g, ' ');
  add(base);
  add(base.trim().split(' ')[0]);
  return out.slice(0, 3);
}
function renderGeoNote(){
  var el=$('geoNote'); if(!el) return;
  var total=(S.plan||[]).length + (S.candidate||[]).length;
  var list=needCoord(), need=list.length;
  var cn=list.filter(function(x){ return x.kind==='cand'; }).length;
  el.textContent = !total ? '일정이 없습니다'
    : need===0 ? '전체 ' + total + '곳 모두 좌표가 있습니다'
    : total + '곳 중 ' + need + '곳에 좌표가 없습니다' +
      (cn ? ' (후보 ' + cn + '곳 포함)' : '');
}
function fillCoords(){
  if(geoBusy){ geoStop=true; return toast('마무리하는 중…'); }   // 실행 중이면 중단 요청
  var list=needCoord();
  if(!list.length) return toast('채울 것이 없습니다');

  geoBusy=true; geoStop=false;
  var btn=$('bGeo'), found=0, failed=0, limited=false;
  btn.textContent='중단하기';

  /* 찾은 좌표를 모았다 한 번에 씁니다. saveSchedule은 한 건에 6초가 넘고
   * 매번 전체 데이터를 받아 화면을 다시 그리기까지 합니다. 건마다 하면
   * 그것만으로 몇 분입니다. 다만 통째로 미루면 중간에 멈췄을 때 다 잃으므로
   * 5개마다 한 번씩 흘려보냅니다. */
  var pend=[];
  function flush(){
    if(!pend.length) return Promise.resolve();
    var batch=pend; pend=[];
    return api('saveCoords', batch)
      .then(function(d){ var c=S.chat; apply(d); S.chat=c; })
      .catch(function(e){
        // 서버에 saveCoords가 아직 없으면(배포 전) 한 건씩 저장합니다.
        // 이게 없으면 방금 찾은 좌표를 그냥 잃습니다.
        if(String((e&&e.message)||'').indexOf('허용되지 않은 함수')===-1){
          failed+=batch.length; found-=batch.length; return;
        }
        return batch.reduce(function(chain, it){
          return chain.then(function(){
            if(it.kind === 'cand'){
              var c0=find(candList(), it.id); if(!c0) return;
              return api('saveCandidate', { id:c0.id, title:c0.title, cat:c0.cat,
                addr:c0.addr, memo:c0.memo, src:c0.src, lat:it.lat, lng:it.lng })
                .then(function(d){ var c=S.chat; apply(d); S.chat=c; })
                .catch(function(){ failed++; found--; });
            }
            var p=find(S.plan, it.id); if(!p) return;
            return api('saveSchedule', { id:p.id, day:p.day, time:p.time, cat:p.cat,
              title:p.title, memo:p.memo, lat:it.lat, lng:it.lng })
              .then(function(d){ var c=S.chat; apply(d); S.chat=c; })
              .catch(function(){ failed++; found--; });
          });
        }, Promise.resolve());
      });
  }

  var done=false;
  function finish(){
    if(done) return; done=true;      // 중단과 완료가 겹쳐도 한 번만
    flush().then(function(){
      geoBusy=false;
      btn.textContent='좌표 없는 곳 찾아 채우기';
      renderGeoNote();
      toast(found + '개 채웠습니다' + (failed?' · '+failed+'개 못 찾음':'') +
            (limited?' · AI 한도 도달':'') + (geoStop&&!limited?' (중단)':''));
    });
  }

  // 쉬지 않고 몰아치면 분당 제한에 걸립니다. 한 번 부를 때마다 잠시 쉽니다.
  function rest(fn){ setTimeout(fn, 1500); }

  (function next(i){
    if(geoStop || i>=list.length) return finish();
    var p=list[i], qs=geoQueries(p.title);

    (function tryQ(k){
      if(geoStop) return finish();
      if(k >= qs.length){ failed++; return rest(function(){ next(i+1); }); }

      $('geoNote').textContent = '(' + (i+1) + '/' + list.length + ') ' + qs[k] +
        (k ? ' — ' + (k+1) + '번째 시도' : '');

      api('lookupPlace', qs[k]).then(function(r){
        if(r && r.ok && okCoord(r.lat, r.lng)){
          found++;
          // 저장은 모아서 하고 화면만 먼저 바꿉니다.
          // flush 뒤에는 apply가 S를 갈아끼우므로 list의 옛 객체가 아니라
          // 지금 S에 있는 것을 찾아 고쳐야 진행 표시가 맞습니다.
          var cur = (p.kind==='cand' ? find(candList(), p.id) : find(S.plan, p.id)) || p.ref;
          cur.lat=r.lat; cur.lng=r.lng;
          pend.push({ id:p.id, lat:r.lat, lng:r.lng, kind:p.kind });
          renderGeoNote();
          if(pend.length >= 5) return flush().then(function(){ rest(function(){ next(i+1); }); });
          return rest(function(){ next(i+1); });
        }
        if(r && !r.ok && String(r.message||'').indexOf('한도')!==-1){
          limited=true; geoStop=true; return finish();
        }
        rest(function(){ tryQ(k+1); });        // 이름을 넓혀 다시 시도합니다
      }).catch(function(){ rest(function(){ tryQ(k+1); }); });
    })(0);
  })(0);
}

/* ═══════════ 키보드 대응 ═══════════ */
function initKeyboardFix(){
  var root=document.documentElement;

  // 1) visualViewport를 쓸 수 있으면 실제 값으로 (아이프레임 밖에서 열었을 때)
  var vv=window.visualViewport;
  function measure(){
    if(!vv) return;
    root.style.setProperty('--vvh', vv.height+'px');
    var kb=Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
    root.style.setProperty('--kb', Math.round(kb)+'px');
  }
  if(vv){ vv.addEventListener('resize', measure); vv.addEventListener('scroll', measure); measure(); }

  // 2) 아이프레임 안에서는 visualViewport가 키보드를 알려주지 않습니다.
  //    입력에 포커스가 가면 시트를 짧게 줄여서 헤더가 화면 밖으로 나가지 않게 합니다.
  var t=null;
  document.addEventListener('focusin', function(e){
    if(!e.target.closest('.scrim')) return;
    // SELECT는 키보드가 아니라 피커를 띄웁니다. 여기서 시트를 줄이면
    // 손가락 자리가 배경으로 바뀌어 시트가 닫혀버립니다.
    if(!/^(INPUT|TEXTAREA)$/.test(e.target.tagName)) return;
    if(e.target.type === 'date' || e.target.type === 'time') return;
    clearTimeout(t);
    document.body.classList.add('kb');
    setTimeout(function(){
      var c=$('chat'); if(c) c.scrollTop=c.scrollHeight;
      e.target.scrollIntoView({block:'nearest'});
    }, 220);
  });
  document.addEventListener('focusout', function(e){
    if(!e.target.closest('.scrim')) return;
    if(!/^(INPUT|TEXTAREA)$/.test(e.target.tagName)) return;
    clearTimeout(t);
    t=setTimeout(function(){
      var a=document.activeElement;
      if(!a || !a.closest || !a.closest('.scrim')){
        document.body.classList.remove('kb');
        // 키보드가 닫히며 iOS가 밀어놓은 스크롤을 되돌립니다
        if(document.body.classList.contains('locked')) window.scrollTo(0,0);
        syncLock();
      }
    }, 150);
  });
}

/** 상단바가 어두운 사진 위에 걸쳐 있으면 흰 글자로 전환 */

/* ═══════════ 지금 ═══════════ */
/* ═══════════ 여행 중 모드 ═══════════
   계획할 때와 여행할 때는 필요한 게 다릅니다. 여행 중에는 Day 1~4 전체가 아니라
   "지금 몇 시고, 다음이 뭐고, 거기까지 얼마나 걸리는지"만 보면 됩니다.
   여행 기간(todayDay() > 0)에만 오늘 일정을 앞에 세우고, 그 외에는 기존 화면 그대로입니다. */

/* 두 좌표 사이 거리(km) */
function distKm(a, b){
  if(!a || !b) return null;
  var R=6371, dLa=(b[0]-a[0])*Math.PI/180, dLn=(b[1]-a[1])*Math.PI/180;
  var la1=a[0]*Math.PI/180, la2=b[0]*Math.PI/180;
  var x=Math.sin(dLa/2)*Math.sin(dLa/2) +
        Math.sin(dLn/2)*Math.sin(dLn/2)*Math.cos(la1)*Math.cos(la2);
  return R * 2 * Math.atan2(Math.sqrt(x), Math.sqrt(1-x));
}
/* 도쿄 기준 이동 시간(분). HANDOFF 5장의 튜닝된 상수를 서버와 동일하게 씁니다.
   여기서 값을 바꾸면 Code.gs의 travelMin_도 같이 바꿔야 검토 결과와 어긋나지 않습니다. */
function travelMin(km){
  if(km < 0.4) return 4;
  if(km < 1.3) return Math.round(km*12) + 2;   // 도보
  return Math.round(km*3.2) + 12;              // 전철 (환승·대기 포함)
}
/* 두 일정 사이 이동 안내. 좌표가 없으면 null (없는 걸 지어내지 않습니다) */
function moveHint(from, to){
  var a=coordOf(from), b=coordOf(to);
  if(!a || !b) return null;
  var km=distKm(a,b);
  if(km===null) return null;
  if(km < 0.15) return null;                   // 사실상 같은 자리
  var m=travelMin(km);
  return { km: km, min: m,
           text: (km<1.3 ? '도보 ' : '이동 ') + m + '분 · ' +
                 (km<1 ? Math.round(km*1000)+'m' : km.toFixed(1)+'km') };
}
function hhmm(m){
  m=((m%1440)+1440)%1440;
  return String(Math.floor(m/60)).padStart(2,'0') + ':' + String(m%60).padStart(2,'0');
}

function renderToday(){
  var slot=$('todaySlot'); if(!slot) return;
  var td=todayDay();
  if(td<=0){ slot.innerHTML=''; return; }          // 여행 전·후에는 쓰지 않습니다

  var today=S.plan.filter(function(p){ return +p.day===td; }).sort(byTime);
  if(!today.length){ slot.innerHTML=''; return; }

  var now=new Date(), nowM=now.getHours()*60+now.getMinutes();
  var d=dayDate(td);

  // 지금 진행 중인 것과 다음 것을 찾습니다
  var curIdx=-1;
  for(var i=0;i<today.length;i++){ if(toMin(today[i].time)<=nowM) curIdx=i; }
  var nextIdx = curIdx+1 < today.length ? curIdx+1 : -1;

  var rows=today.map(function(p, i){
    var t=toMin(p.time), done = i<curIdx, isCur = i===curIdx, isNext = i===nextIdx;
    var cls='tday__i' + (done?' is-done':'') + (isCur?' is-cur':'') + (isNext?' is-next':'');
    var tag = isCur ? '지금' : isNext ? '다음' : '';
    var h='<div class="'+cls+'">'+
      '<div class="tday__t">'+esc(p.time||'–')+(tag?'<span class="tday__tag">'+tag+'</span>':'')+'</div>'+
      '<div class="tday__b">'+
        '<div class="tday__n">'+esc(nice(p.title))+'</div>'+
        (p.cat?'<div class="tday__c"><i class="cdot" style="background:'+kc(p.cat)+'"></i>'+esc(p.cat)+'</div>':'')+
      '</div></div>';

    // 다음 일정까지의 이동 안내 (지금·다음 구간에서만 — 그 외엔 소음입니다)
    var nx=today[i+1];
    if(nx && (isCur || isNext)){
      var mv=moveHint(p, nx);
      var gap=toMin(nx.time)-t;
      if(mv){
        var tight = isFinite(gap) && gap<9999 && gap < mv.min;
        h+='<div class="tday__mv'+(tight?' is-tight':'')+'">'+esc(mv.text)+
           (tight?' · 간격 '+gap+'분, 빠듯합니다':'')+'</div>';
      }
    }
    return h;
  }).join('');

  // 상단 요약: 다음 일정까지 남은 시간
  var head='';
  if(nextIdx>=0){
    var nx2=today[nextIdx], diff=toMin(nx2.time)-nowM;
    var when = diff<=0 ? '곧' : diff<60 ? diff+'분 후' : Math.floor(diff/60)+'시간 '+(diff%60)+'분 후';
    var mv2 = curIdx>=0 ? moveHint(today[curIdx], nx2) : null;
    head='<div class="tday__hd"><span>다음 '+esc(nice(nx2.title))+'</span><time>'+esc(when)+'</time></div>';
    if(mv2 && diff>0 && diff < mv2.min)
      head+='<div class="tday__warn">이동에 '+mv2.min+'분 필요 — 지금 나서야 합니다</div>';
  } else {
    head='<div class="tday__hd"><span>오늘 일정을 모두 마쳤습니다</span></div>';
  }

  slot.innerHTML='<div class="stack"><div class="card glass">'+
    '<div class="tday__day">Day '+td+(d?' · '+esc(fmtD(d)):'')+'  ·  지금 '+hhmm(nowM)+'</div>'+
    head+'<div class="tday__l">'+rows+'</div>'+
    '<button class="link" data-goday="'+td+'">일정에서 열기</button>'+
    '</div></div>';
}

function renderNow(){
  var slot=$('nowSlot'), td=todayDay(), list=S.plan.slice().sort(byTime);
  if(!list.length){ slot.innerHTML=''; return; }
  // 여행 중에는 오늘 화면이 같은 내용을 더 자세히 보여줍니다. 두 번 띄우지 않습니다.
  if(td>0 && list.filter(function(p){ return +p.day===td; }).length){ slot.innerHTML=''; return; }
  var now=new Date(), nowM=now.getHours()*60+now.getMinutes(), cur=null, nxt=null;

  if(td>0){
    var today=list.filter(function(p){ return +p.day===td; });
    for(var i=0;i<today.length;i++){
      if(toMin(today[i].time)<=nowM) cur=today[i]; else { nxt=today[i]; break; }
    }
    if(!nxt) nxt=list.filter(function(p){ return +p.day>td; })[0]||null;
  } else if(td===0) nxt=list[0];

  if(!cur&&!nxt){ slot.innerHTML=''; return; }

  var head = cur||nxt, isNow = !!cur;
  var pct=0;
  if(cur){
    var s=toMin(cur.time), e = (nxt && +nxt.day===td) ? toMin(nxt.time) : s+90;
    pct=Math.max(0,Math.min(100,(nowM-s)/Math.max(e-s,1)*100));
  }
  var when='';
  if(nxt){
    if(+nxt.day===td){ var diff=toMin(nxt.time)-nowM;
      when = diff<=0?'곧': diff<60? diff+'분 후' : Math.floor(diff/60)+'시간 '+(diff%60)+'분 후';
    } else { var dd=dayDate(nxt.day); when = dd? fmtDs(dd) : 'Day '+nxt.day; }
  }

  var h='<div class="stack"><div class="card glass"><div class="now__label">'+(isNow?'지금':'다음 일정')+'</div>'+
    '<h2 class="now__h">'+esc(nice(head.title))+'</h2>'+
    '<p class="now__meta">'+esc(head.time||'')+(head.cat?' · '+esc(head.cat):'')+'</p>';
  if(isNow) h+='<div class="now__track"><div class="now__fill" style="width:'+pct.toFixed(0)+'%"></div></div>';
  if(cur&&nxt) h+='<div class="now__next">다음 <b>'+esc(nice(nxt.title))+'</b><time>'+esc(when)+'</time></div>';
  else if(!cur&&nxt&&td>0) h+='<div class="now__next">시작까지<time>'+esc(when)+'</time></div>';
  h+='</div></div>';
  slot.innerHTML=h;
}

/* ═══════════ 예약 (항공·숙소) ═══════════ */
/* 예약 종류 — 아이콘과 색을 한 곳에서 관리합니다 */
var BKINDS = [
  { k:'항공', icon:'plane',  cls:''      },
  { k:'숙소', icon:'bed',    cls:'stay'  },
  { k:'식당', icon:'fork',   cls:'food'  },
  { k:'티켓', icon:'ticket', cls:'tick'  },
  { k:'기타', icon:'pin',    cls:'etc'   }
];
function bkMeta(kind){
  for(var i=0;i<BKINDS.length;i++) if(BKINDS[i].k===kind) return BKINDS[i];
  return BKINDS[BKINDS.length-1];
}

  var n={};
  list.forEach(function(b){ n[bkMeta(b.kind).k]=(n[bkMeta(b.kind).k]||0)+1; });
  var have=BKINDS.filter(function(x){ return n[x.k]; });

function copyText(t){
  function done(){ toast('복사했습니다'); }
  function fallback(){
    var a=document.createElement('textarea');
    a.value=t; a.style.position='fixed'; a.style.opacity='0';
    document.body.appendChild(a); a.select();
    try{ document.execCommand('copy'); done(); } catch(e){ toast('복사하지 못했습니다'); }
    document.body.removeChild(a);
  }
  if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(done, fallback);
  else fallback();
}

/* ── 하루가 얼마나 빡센지 ──
 * 좌표가 다 있으니 이동 시간과 거리를 그대로 잴 수 있습니다. AI를 안 씁니다.
 * 32건을 눈으로 훑지 않아도 '이 날은 이동에만 2시간'이 보입니다. */
function dayStat(dn){
  var list=(S.plan||[]).filter(function(p){ return String(p.day)===String(dn); }).sort(byTime);
  var min=0, km=0, legs=0;
  for(var i=0;i<list.length-1;i++){
    var a=coordOf(list[i]), b=coordOf(list[i+1]);
    if(!a || !b) continue;
    var d=distKm(a,b);
    if(d < 0.15) continue;              // 사실상 같은 자리
    km += d; min += travelMin(d); legs++;
  }
  return { n:list.length, min:Math.round(min), km:km, legs:legs };
}
function dayStatHtml(dn){
  var s=dayStat(dn);
  if(!s.n) return '';
  var t = s.min>=60 ? (Math.floor(s.min/60)+'시간'+(s.min%60 ? ' '+(s.min%60)+'분' : '')) : (s.min+'분');
  return '<span class="daystat">'+s.n+'곳'+
    (s.legs ? ' · 이동 '+t+' · '+s.km.toFixed(1)+'km' : '')+
    (s.min>=150 ? ' <b>빡셈</b>' : '')+'</span>';
}

/* ── 순서 바꾸기 ──
 * 옆 항목과 시각을 맞바꿉니다. 그것만 바꿉니다.
 *
 * 처음에는 하루 전체를 다시 계산했는데(이동+체류를 더해가며 뒤로 밀기),
 * 두 항목 자리만 바꿨는데 '22:00 호텔 복귀'가 19:50으로 당겨졌습니다.
 * 저녁 시각처럼 일부러 맞춰둔 것까지 무너집니다.
 * 자리만 바꾸는 게 사용자가 기대하는 동작이고, 되돌리기도 반대 화살표 한 번입니다.
 *
 * 대신 바뀐 자리에서 이동이 빠듯해지면 알려줍니다. 숫자를 숨기지 않습니다. */
function movePlan(id, dir){
  var me = find(S.plan, id); if(!me) return;
  var list = (S.plan||[]).filter(function(p){ return String(p.day)===String(me.day); }).sort(byTime);
  var at = list.map(function(p){ return String(p.id); }).indexOf(String(id));
  var to = at + (dir==='up' ? -1 : 1);
  if(at < 0 || to < 0 || to >= list.length){
    return toast(dir==='up' ? '이미 그날 처음입니다' : '이미 그날 마지막입니다');
  }

  var A = list[at], B = list[to];
  if(!/^\d{2}:\d{2}$/.test(A.time||'') || !/^\d{2}:\d{2}$/.test(B.time||'')){
    return toast('시각이 없는 일정은 순서를 바꿀 수 없습니다');
  }
  var ta = A.time, tb = B.time;

  // 화면 먼저
  A.time = tb; B.time = ta;
  renderAllPlan();

  api('saveTimes', [{ id:A.id, time:tb }, { id:B.id, time:ta }])
    .then(function(d){
      var c=S.chat; apply(d); S.chat=c;
      // 바뀐 순서에서 이동이 빠듯한지 확인해 알려줍니다
      var after=(S.plan||[]).filter(function(p){ return String(p.day)===String(me.day); }).sort(byTime);
      var warn=null;
      for(var i=0;i<after.length-1;i++){
        var h=moveHint(after[i], after[i+1]);
        if(!h) continue;
        var gap=toMin(after[i+1].time)-toMin(after[i].time);
        if(gap < h.min){ warn = after[i].title+' → '+after[i+1].title+' 이동에 '+h.min+'분 필요한데 '+gap+'분뿐입니다'; break; }
      }
      toast(warn || '순서를 바꿨습니다');
    })
    .catch(function(e){
      A.time=ta; B.time=tb; renderAllPlan();     // 실패하면 되돌립니다
      toast('저장 실패: '+(e.message||e));
    });
}

/* ── 지하철 노선색 ──
 * 도쿄는 역 안내판이 노선색으로 되어 있습니다. 앱에서도 같은 색을 쓰면
 * 메모를 읽지 않아도 "아, 주황색 긴자선" 하고 눈으로 찾게 됩니다.
 * 색은 각 사업자의 공식 노선색입니다. 밝은 색(은색·금색·노랑)은 글자를 검게 둡니다.
 * 이름은 메모에 적힌 한국어 표기를 그대로 찾습니다 — '도쿄메트로 긴자선'도 '긴자선'으로 잡힙니다. */
/* 긴 이름을 앞에 둡니다. '세이부 신주쿠선'이 도에이 '신주쿠선'으로 잡히면 안 됩니다.
   겹치는 것은 아래 linesIn에서 걸러냅니다. */
var LINES = [
  // 사철 — 이름이 겹칠 수 있어 먼저 봅니다
  ['세이부 신주쿠선','#1C3F94'], ['세이부 이케부쿠로선','#1C3F94'], ['세이부선','#1C3F94'],
  ['케이오 이노카시라선','#0075C2'], ['케이오선','#DD0077'],
  ['도부 스카이트리라인','#0F6CB6'], ['도부 이세사키선','#0F6CB6'], ['도부선','#0F6CB6'],
  ['오다큐선','#2581C6'], ['도요코선','#DA0442'], ['덴엔토시선','#009BBF'],
  ['나리타 익스프레스','#E60012'], ['스카이라이너','#003894'], ['케이세이','#003894'],
  ['츠쿠바 익스프레스','#000098'], ['게이큐','#DA0442'],
  ['유리카모메','#0080C6'], ['모노레일','#0072BC'],
  // 도쿄메트로
  ['긴자선','#FF9500'], ['마루노우치선','#F62E36'], ['히비야선','#B5B5AC',1],
  ['도자이선','#009BBF'], ['치요다선','#00BB85'], ['유라쿠초선','#C1A470',1],
  ['한조몬선','#8F76D6'], ['난보쿠선','#00AC9B'], ['후쿠토신선','#9C5E31'],
  // 도에이
  ['아사쿠사선','#E85298'], ['미타선','#0079C2'], ['신주쿠선','#6CBB5A'], ['오에도선','#B6007A'],
  // JR
  ['야마노테선','#9ACD32',1], ['주오선','#F15A22'], ['소부선','#FFD400',1],
  ['케이힌토호쿠선','#00B2E5'], ['사이쿄선','#00AC9B'], ['쇼난신주쿠라인','#E21F26'],
  ['케이요선','#C9252F'], ['요코스카선','#0067C0'], ['조반선','#00B48D']
];
function linesIn(text){
  var t = String(text||''), hit = [];
  LINES.forEach(function(L){ if(t.indexOf(L[0]) !== -1) hit.push(L); });
  /* '세이부 신주쿠선'이 걸리면 '신주쿠선'은 버립니다.
     짧은 이름이 긴 이름 안에 들어 있으면 그건 같은 노선을 두 번 세는 것입니다. */
  var out = hit.filter(function(L){
    return !hit.some(function(O){ return O !== L && O[0].indexOf(L[0]) !== -1; });
  });
  return out.slice(0, 3);      // 한 줄에 세 개면 충분합니다
}
function lineChips(text){
  return linesIn(text).map(function(L){
    return '<span class="ln" style="background:'+L[1]+(L[2]?';color:#1c1c1e':'')+'">'+esc(L[0])+'</span>';
  }).join('');
}

function evHtml(p,isNow){
  var mm=parseMemo(p.memo), q=encodeURIComponent(p.title||'');
  var sub=[]; if(p.cat) sub.push(esc(p.cat));
  if(mm.cost) sub.push(esc(mm.cost.split(/[·,]/)[0].trim()));

  // 노선은 이동방법 메모에 적혀 있습니다. 제목에도 있을 수 있어 같이 봅니다.
  var chips = lineChips((mm.move||'') + ' ' + (p.title||''));

  if(mm.cost) det+='<div class="drow"><b>예상</b> '+esc(nice(mm.cost))+'</div>';
  mm.notes.forEach(function(n){ det+='<div class="dnote">'+esc(nice(n))+'</div>'; });
  det+='<div class="dacts">'+
    '<a class="link sm" href="https://www.google.com/maps/search/?api=1&query='+q+'" target="_blank" rel="noopener">지도에서 보기</a>'+
    '<a class="link sm" href="https://www.google.com/maps/dir/?api=1&destination='+q+'&travelmode=transit" target="_blank" rel="noopener">길찾기</a>'+
    '<button class="link sm" data-mv="up|'+esc(p.id)+'">앞으로</button>'+
    '<button class="link sm" data-mv="dn|'+esc(p.id)+'">뒤로</button>'+
    '<button class="link sm" data-edit="'+esc(p.id)+'">수정</button>'+
    '<button class="link-quiet" style="margin-left:auto" data-del="'+esc(p.id)+'">삭제</button></div>';

  return '<article class="ev'+(isNow?' is-now':'')+'" data-ev="'+esc(p.id)+'">'+
    '<div class="ev__row"><span class="ev__t">'+esc(p.time||'–')+'</span>'+
      '<div class="ev__b"><div class="ev__ttl">'+esc(nice(p.title))+'</div>'+
      (sub.length || chips
        ? '<div class="ev__sub">' + (p.cat ? '<i class="cdot" style="background:'+kc(p.cat)+'"></i>' : '') +
          '<span>'+sub.join(' · ')+'</span>' + chips + '</div>'
        : '')+'</div>'+
      '<span class="ev__chev">'+ico('chev',16)+'</span></div>'+
    '<div class="detail">'+det+'</div></article>';
}

/** 어떤 통화든 원화로 환산해 비교합니다 */
function toKrw(e){
  var v=+e.amount||0;
  return (e.cur==='KRW') ? v : v*rate;
}
function money(e){
  var v=+e.amount||0;

function renderCost(){
  var list=S.expense.slice().sort(function(a,b){ return a.day-b.day; });
  var yenSum=0, wonSum=0;
  list.forEach(function(e){ if(e.cur==='KRW') wonSum+=(+e.amount||0); else yenSum+=(+e.amount||0); });
  var totalKrw = yenSum*rate + wonSum;

  $('costTotal').textContent='₩ '+Math.round(totalKrw).toLocaleString('ko-KR');
  var parts=[];
  if(yenSum) parts.push('¥ '+Math.round(yenSum).toLocaleString('ko-KR'));
  if(wonSum) parts.push('₩ '+Math.round(wonSum).toLocaleString('ko-KR')+' (한국 결제)');
  $('costKrw').textContent = parts.join('  +  ') || '기록 없음';

  var by={};
  list.forEach(function(e){ var k=guessCat(e); by[k]=(by[k]||0)+toKrw(e); });
  var keys=Object.keys(by).sort(function(a,b){ return by[b]-by[a]; });
  var total = totalKrw;
  $('costBar').innerHTML= total? keys.map(function(k){
    return '<i style="width:'+(by[k]/total*100).toFixed(2)+'%;background:'+kc(k)+'"></i>';
  }).join('') : '';
  $('costLegend').innerHTML=keys.map(function(k){
    return '<span><i style="background:'+kc(k)+'"></i>'+esc(k)+' <b>₩ '+Math.round(by[k]).toLocaleString('ko-KR')+'</b></span>';
  }).join('');

  renderSettle(list);
  $('costRows').innerHTML = list.length ? '<div class="stack"><div class="tlcard glass">'+list.map(function(e){
    var cat=guessCat(e);
    var s=[esc(cat), 'Day '+esc(e.day), esc(e.method||'')]; if(e.payer) s.push(esc(e.payer));
    return '<div class="crow" data-cost="'+esc(e.id)+'"><div class="crow__b">'+
      '<div class="crow__t">'+esc(e.title)+'</div>'+
      '<div class="crow__s"><i class="cdot" style="background:'+kc(cat)+'"></i>'+
      '<span>'+s.filter(Boolean).join(' · ')+'</span></div></div>'+
      '<div class="crow__n"><b>'+money(e)+'</b>'+
        (e.cur==='KRW' ? '' : '<small>'+krw(+e.amount||0)+'</small>')+'</div></div>';
  }).join('')+'</div></div>' : '<div class="empty"><div class="empty__t">지출 기록이 없습니다</div><div class="empty__s">쓴 돈을 남기면 인원별 정산까지 계산합니다.</div></div>';
}
function guessCat(e){
  var t=(e.title||'')+' '+(e.memo||'');
  if(/커피|카페|디저트|라떼|아라비카|스타벅스/.test(t)) return '카페';
  if(/라멘|스시|초밥|식당|맛집|점심|저녁|디너|런치|우나기|장어|야키니쿠|야키토리|와규|규카츠|카레|덮밥|정식|코스|오마카세|이자카야|하이볼|몬자|타코야키|우동|소바/.test(t)) return '식사';
  if(/호텔|숙소|체크인|체크아웃|료칸|숙박/.test(t)) return '숙소';
  if(/입장|티켓|관람|전망|스카이|박물관|미술관|신사|타워/.test(t)) return '관광';
  if(/쇼핑|면세|드럭|굿즈|기념품|편집숍|백화점|돈키/.test(t)) return '쇼핑';
  if(/보험|와이파이|유심|이심|esim|로밍|환전|비자|여권/i.test(t)) return '준비';
  if(/역|선|공항|항공|비행|교통|패스|택시|지하철|버스|전철|익스프레스|급행|스이카|파스모|철도/.test(t)) return '교통';
  return '기타';
}
function renderSettle(list){
  var slot=$('settleSlot'), payers=[];
  list.forEach(function(e){ if(e.payer&&payers.indexOf(e.payer)<0) payers.push(e.payer); });
  if(payers.length<2){ slot.innerHTML=''; return; }
  var total=list.reduce(function(s,e){ return s+toKrw(e); },0), share=total/payers.length, paid={};
  payers.forEach(function(p){ paid[p]=0; });
  list.forEach(function(e){ if(paid.hasOwnProperty(e.payer)) paid[e.payer]+=toKrw(e); });
  var debt=[],cred=[];
  payers.forEach(function(p){ var b=paid[p]-share; if(b<-1) debt.push([p,-b]); else if(b>1) cred.push([p,b]); });
  debt.sort(function(a,b){return b[1]-a[1];}); cred.sort(function(a,b){return b[1]-a[1];});
  var rows=[],i=0,j=0;
  while(i<debt.length&&j<cred.length){
    var amt=Math.min(debt[i][1],cred[j][1]);
    rows.push('<div class="settle__r"><b>'+esc(debt[i][0])+'</b> → <b>'+esc(cred[j][0])+'</b><em>₩ '+Math.round(amt).toLocaleString('ko-KR')+'</em></div>');
    debt[i][1]-=amt; cred[j][1]-=amt;
    if(debt[i][1]<1) i++; if(cred[j][1]<1) j++;
  }
  slot.innerHTML='<div class="stack"><div class="card glass"><div class="ty-caption-st muted-80" style="margin-bottom:8px">정산 · 1인당 ₩ '+Math.round(share).toLocaleString('ko-KR')+'</div>'+
    (rows.join('')||'<div class="settle__r">정산할 금액이 없습니다</div>')+'</div></div>';
}

/* ── 빈 시간에 후보 끼워넣기 ──
 * AI를 부르지 않습니다. 좌표와 이동 시간 상수만으로 계산해서 즉시 나오고 한도도 안 씁니다.
 * 숫자는 일정 검토와 같은 travelMin을 쓰므로 두 화면이 어긋나지 않습니다. */
function stayMin(cat){
  if(cat === '카페') return 40;
  if(cat === '식당/맛집') return 60;
  if(cat === '명소/관광') return 90;
  if(cat === '쇼핑') return 60;
  return 60;
}
function hhmm(m){
  m = Math.max(0, Math.round(m));
  return ('0'+Math.floor(m/60)%24).slice(-2) + ':' + ('0'+(m%60)).slice(-2);
}
var DAY_START = 9*60, DAY_END = 21*60;   // 이 밖은 자거나 쉬는 시간으로 봅니다
var SAME_PLACE_KM = 0.3;                 // 이보다 가까우면 사실상 같은 자리입니다

/* 앞 일정이 끝났을 법한 시각부터 다음 일정 시작까지를 '빈 시간'으로 봅니다.
 * 시작 시각만 보고 재면 앞 일정이 진행 중인 시간까지 비어 있다고 착각합니다. */
function planGaps(){
  var byDay = {}, out = [];
  (S.plan || []).forEach(function(p){ (byDay[p.day] = byDay[p.day] || []).push(p); });
  Object.keys(byDay).forEach(function(d){
    var list = byDay[d].slice().sort(byTime);
    for(var i = 0; i < list.length - 1; i++){
      var a = list[i], b = list[i+1];
      var t1 = toMin(a.time), t2 = toMin(b.time);
      if(t1 >= 9999 || t2 >= 9999) continue;
      var aEnd = t1 + stayMin(a.cat);
      if(t2 - aEnd < 60) continue;              // 한 시간도 안 남으면 넣을 자리가 아닙니다
      /* 밤에서 아침으로 걸친 구간은 자는 시간입니다. 실제 데이터에서
         'Day2 02:38~10:00 (442분)'을 빈 시간으로 잡은 적이 있습니다.
         낮 시간대로 잘라내고, 그러고도 한 시간이 남을 때만 씁니다. */
      var from = Math.max(aEnd, DAY_START), to = Math.min(t2, DAY_END);
      if(to - from < 60) continue;
      out.push({ day: d, after: a, before: b, from: from, to: to });
    }
  });
  return out;
}

/* 각 후보가 들어갈 수 있는 자리 중 가장 가까운 한 곳씩. 최대 3개. */
var fitList = [];
function findFits(){
  var gaps = planGaps();
  var cands = candList().filter(function(c){ return okCoord(c.lat, c.lng); });
  var best = {};
  gaps.forEach(function(g){
    var A = coordOf(g.after), B = coordOf(g.before);
    if(!A || !B) return;
    cands.forEach(function(c){
      var C = [Number(c.lat), Number(c.lng)];
      /* 앞뒤 일정과 거의 같은 자리면 제안할 이유가 없습니다.
         '우에노 공원'을 '우에노 온시 공원' 옆(4분)에 넣으라고 한 적이 있습니다. */
      if(distKm(A, C) < SAME_PLACE_KM || distKm(C, B) < SAME_PLACE_KM) return;
      var go = travelMin(distKm(A, C)), back = travelMin(distKm(C, B));
      /* 체류 시간을 정해놓고 '들어간다/안 들어간다'로 자르면 아무것도 안 남습니다.
         실제 빈 시간이 60~90분인데 명소를 90분으로 잡으면 전부 탈락합니다.
         대신 오가는 시간을 빼고 '실제로 머물 수 있는 시간'을 계산해 보여주고,
         짧게 보고 나올지는 사용자가 정하게 합니다. */
      var avail = (g.to - g.from) - go - back;
      if(avail < 40) return;                            // 40분도 안 되면 갈 만하지 않습니다
      var k = String(c.id);
      if(best[k] && best[k].avail >= avail) return;     // 더 여유로운 자리가 이미 있습니다
      best[k] = { cand: c, day: g.day, at: g.from + go, go: go, back: back, avail: avail,
                  tight: avail < stayMin(c.cat), after: g.after.title };
    });
  });
  return Object.keys(best).map(function(k){ return best[k]; })

}

/* ═══════════ 링크 순서 바꾸기 ═══════════
 * 두 가지를 끕니다. 카드를 끌면 같은 구분 안에서, 구분 이름을 끌면
 * 그 구분 전체(제목 + 카드 묶음)가 통째로 움직입니다.
 * iOS는 스크롤이 한 번 시작되면 취소할 수 없습니다. 그래서 길게 누르는 동안
 * 손가락이 움직이면 끌기를 포기하고 스크롤에 양보합니다.
 * 링크 시트에는 순서 열이 없습니다 — 행 순서가 곧 표시 순서라서
 * 서버의 reorderLinks가 id 순서대로 행을 다시 씁니다.
 * 구분을 옮겨도 카드들이 통째로 따라가므로 같은 함수로 저장됩니다. */
var lnDrag = null, lnBlockClick = false;

function lnBefore(container, sel, y, me){
  // y 위치 기준으로 어느 형제 앞에 넣을지 고릅니다. null이면 맨 뒤입니다.
  var best=null, bestOff=-Infinity;
  [].slice.call(container.children).forEach(function(el){
    if(el===me || !el.matches(sel)) return;
    var r=el.getBoundingClientRect(), off=y-r.top-r.height/2;
    if(off<0 && off>bestOff){ bestOff=off; best=el; }
  });
  return best;
}

function lnCommit(){
  var ids=[].slice.call(document.querySelectorAll('#linkList .lnk'))
    .map(function(el){ return el.getAttribute('data-lid'); });
  if(!ids.length) return;
  var pos={}; ids.forEach(function(id,i){ pos[id]=i; });
  S.link.sort(function(a,b){
    var x=pos[a.id], y=pos[b.id];
    return (x==null?9999:x)-(y==null?9999:y);
  });
  renderLinks();        // ↑↓의 처음·끝 판정을 새 순서로 다시 계산해야 합니다
  lnSaveOrder();
}

/* 순서 저장은 saveInBackground를 쓰지 않고 따로 둡니다. 이유가 셋입니다.
 * 1) 저장이 6초쯤 걸리는데 화살표는 1초에 여러 번 눌립니다. 누를 때마다 보내면
 *    응답이 뒤바뀌어 도착하고, 늦게 온 옛 응답이 새 순서를 덮어씁니다.
 *    → 잠깐 기다렸다 마지막 순서 한 번만 보냅니다.
 * 2) 그래도 늦게 온 응답은 번호로 걸러 버립니다.
 * 3) poll()이 8초마다 revision을 보고 다르면 load()로 통째로 덮어씁니다.
 *    저장이 끝나기 전에 끼어들면 화면이 옛 순서로 돌아갑니다.
 *    → 저장이 끝날 때까지 lnDirty로 poll을 막습니다. */
var lnSaveTimer = null, lnSaveSeq = 0, lnDirty = false;

function lnSaveOrder(){
  lnDirty = true;
  // 화면은 구분별로 묶어서 보여주므로, 시트에 흩어져 있던 같은 구분이 화면에서는
  // 붙어 보입니다. 그대로 두면 시트 순서와 보이는 순서가 어긋난 채 굳습니다.
  // 저장할 때 묶인 순서로 정리해 둘을 일치시킵니다.
  applyCatOrder(catOrder());
  saveCache(S);
  clearTimeout(lnSaveTimer);
  lnSaveTimer = setTimeout(function(){
    lnSaveTimer = null;
    var ids = S.link.map(function(x){ return x.id; });
    var my = ++lnSaveSeq;
    api('reorderLinks', ids).then(function(d){
      if(my !== lnSaveSeq) return;      // 그 사이 또 바꿨습니다. 이 응답은 버립니다.
      lnDirty = false;
      apply(d);
    }).catch(function(e){
      if(my !== lnSaveSeq) return;
      lnDirty = false;
      if(e && e.net){
        enqueue('reorderLinks', ids); saveCache(S); syncOk = false; renderFacts();
        return toast('오프라인 — 연결되면 저장합니다');
      }
      toast('순서 저장 실패: ' + (e.message || e)); load();
    });
  }, 700);
}

/* 구분 통째로 옮기기. 구분에는 자기 순서를 적어둘 자리가 없으므로
 * S.link를 새 구분 순서대로 다시 늘어놓습니다. 화면의 구분 순서는
 * "S.link에 처음 나온 순서"라서 그것만으로 순서가 정해집니다. */
function catOrder(){
  var keys=[];
  S.link.forEach(function(l){ var c=l.category||'기타'; if(keys.indexOf(c)<0) keys.push(c); });
  return keys;
}
function applyCatOrder(keys){
  var out=[];
  keys.forEach(function(c){
    S.link.forEach(function(l){ if((l.category||'기타')===c) out.push(l); });
  });
  if(out.length!==S.link.length) return false;   // 하나라도 흘리면 저장하지 않습니다
  S.link=out;
  return true;
}
function moveGroup(cat, dir){
  var keys=catOrder();
  var at=keys.indexOf(cat);
  var to=at + (dir==='up' ? -1 : 1);
  if(at<0 || to<0 || to>=keys.length) return;
  keys.splice(to, 0, keys.splice(at, 1)[0]);
  if(!applyCatOrder(keys)) return;
  renderLinks();
  lnSaveOrder();
}

function lnEnd(commit){
  if(!lnDrag) return;
  clearTimeout(lnDrag.timer);
  var was=lnDrag.on, card=lnDrag.card;
  lnDrag=null;
  if(card) card.classList.remove('is-drag');
  document.body.classList.remove('lndrag');
  if(was){
    // 손을 뗀 뒤 따라오는 click 한 번을 삼킵니다. 안 그러면 '수정'이 열립니다.
    lnBlockClick=true;
    setTimeout(function(){ lnBlockClick=false; }, 350);
  }
  if(was && commit) lnCommit();
}

function initLinkDrag(){
  var box=$('linkList');
  if(!box || box.__dragInit) return;
  box.__dragInit=true;   // 컨테이너는 다시 그려도 그대로라 한 번만 붙이면 됩니다

  box.addEventListener('pointerdown', function(e){
    if(e.button!=null && e.button!==0) return;
    if(!e.target.closest) return;
    if(e.target.closest('a,button')) return;      // 열기·수정·↑↓는 평소대로 눌리게

    // 구분 이름을 누르면 그 구분 전체를, 카드를 누르면 카드 하나를 끕니다.
    var card, sel;
    if(e.target.closest('.lgroup')){ card=e.target.closest('.lgrpbox'); sel='.lgrpbox'; }
    else { card=e.target.closest('.lnk'); sel='.lnk'; }
    if(!card || !card.parentNode) return;

    lnEnd(false);
    var st={ card:card, sel:sel, on:false, x:e.clientX, y:e.clientY, pid:e.pointerId };
    st.timer=setTimeout(function(){
      if(lnDrag!==st) return;
      st.on=true;
      card.classList.add('is-drag');
      document.body.classList.add('lndrag');
      try { card.setPointerCapture(st.pid); } catch(err){}
      if(navigator.vibrate) try { navigator.vibrate(12); } catch(err){}
    }, 350);
    lnDrag=st;
  });

  box.addEventListener('pointermove', function(e){
    if(!lnDrag) return;
    if(!lnDrag.on){
      // 아직 켜지기 전에 움직였다 = 스크롤하려는 것입니다. 끌기를 포기합니다.
      // 손가락은 가만히 있어도 몇 px씩 떨리므로 문턱을 너무 좁히면 아예 안 걸립니다.
      var dx=e.clientX-lnDrag.x, dy=e.clientY-lnDrag.y;
      if(dx*dx+dy*dy>196) lnEnd(false);
      return;
    }
    // 카드는 같은 구분(.stack) 안에서, 구분은 형제 구분들 사이에서만 움직입니다
    var grp=lnDrag.card.parentNode;
    var ref=lnBefore(grp, lnDrag.sel, e.clientY, lnDrag.card);
    if(ref!==lnDrag.card.nextSibling) grp.insertBefore(lnDrag.card, ref);
  });

  box.addEventListener('pointerup', function(){ lnEnd(true); });
  box.addEventListener('pointercancel', function(){ lnEnd(false); });

  box.addEventListener('click', function(e){
    if(!lnBlockClick) return;
    lnBlockClick=false;
    e.stopPropagation(); e.preventDefault();
  }, true);

  // 끌기 중에는 화면이 같이 스크롤되지 않게 막습니다.
  // passive:false 여야 preventDefault가 먹힙니다.
  box.addEventListener('touchmove', function(e){
    if(lnDrag && lnDrag.on) e.preventDefault();
  }, { passive:false });
}

/** 핀 옆에 붙일 짧은 한국어 이름 */
function pinLabel(title){
  var t = nice(title)
    .replace(/\s*[\(（][^)）]*[\)）]\s*/g, ' ')   // 괄호 안(일본어·영문 병기) 제거
    .replace(/\s{2,}/g, ' ').trim();
  if(t.indexOf('\u2192') >= 0) {                  // "A → B 이동"이면 도착지만
    t = t.split('\u2192').pop().trim();
  }
  t = t.replace(/\s*(이동|복귀)$/, '').trim();
  if(t.length > 10) t = t.slice(0, 10) + '\u2026';
  return t;
}

/** 일정에 저장된 좌표를 먼저 쓰고, 없으면 이름으로 사전을 찾습니다 */
function coordOf(p){
  if(p && typeof p === 'object'){
    var la=Number(p.lat), ln=Number(p.lng);
    if(isFinite(la) && isFinite(ln) && !(la===0 && ln===0)) return [la, ln];
    p = p.title;
  }
  var t = String(p||'');
  var arrow = t.split(/\u27A1\uFE0F?|\u2192/);
  if(arrow.length > 1){
    for(var k2 in COORDS) if(arrow[arrow.length-1].indexOf(k2)!==-1) return COORDS[k2];
  }
  for(var k in COORDS) if(t.indexOf(k)!==-1) return COORDS[k];
  return null;
}

function updatePins(){
  if(!lmap||typeof L==='undefined') return;
  marks.forEach(function(m){ lmap.removeLayer(m); }); marks=[];
  if(route){ lmap.removeLayer(route); route=null; }
  var list=S.plan.filter(function(p){ return fDay==='ALL'||String(p.day)===fDay; }).sort(byTime);
  var bounds=[],miss=0,labelled=[];
  list.forEach(function(p,i){

    var mk=L.marker(c,{icon:L.divIcon({className:'',html:'<div class="pin">'+(i+1)+'</div>',iconSize:[26,26],iconAnchor:[13,13]})}).addTo(lmap);
    mk.bindPopup('<b>'+esc(nice(p.title))+'</b><br>'+esc(p.time||''));
    labelled.push([mk, p]);
    marks.push(mk); bounds.push(c);
  });
  // 하루 동선을 선으로 잇습니다. 되돌아가는 구간이 눈으로 보입니다.
  if(bounds.length>1 && bounds.length<=12 && L.polyline){
    route=L.polyline(bounds, {
      color: getComputedStyle(document.documentElement).getPropertyValue('--primary').trim() || '#0066cc',
      weight:2.5, opacity:.65,
      dashArray:'7 6', lineCap:'round', lineJoin:'round'
    }).addTo(lmap);
    route.bringToBack();
  }

  // 배경 지도가 일본어라 못 읽어도 되도록, 핀 옆에 한국어 이름을 붙입니다.
  // 핀이 너무 많으면 겹쳐서 오히려 방해되니 10개까지만 답니다.
  if(labelled.length<=10){
    labelled.forEach(function(pair){
      var mk=pair[0];
      if(mk.bindTooltip) mk.bindTooltip(esc(pinLabel(pair[1].title)),
        {permanent:true, direction:'right', offset:[11,0], className:'pinlab'});
    });
  }
  /* 후보도 같이 찍습니다. 어디쯤인지 눈으로 봐야 "이 근처니까 여기 넣자"가 됩니다.
     일정 핀과 헷갈리지 않게 번호 없는 흐린 핀으로 두고,
     지도 범위 계산(bounds)에는 넣지 않습니다 — 넣으면 엉뚱하게 축소됩니다. */
  candList().forEach(function(c){
    if(!okCoord(c.lat, c.lng)) return;
    var mk=L.marker([Number(c.lat), Number(c.lng)], {icon:L.divIcon({
      className:'', html:'<div class="pin pin--cand"></div>', iconSize:[18,18], iconAnchor:[9,9]
    })}).addTo(lmap);
    /* 지도를 보다 "이 근처네" 싶을 때 그 자리에서 끝나게 합니다.
       예전에는 지도를 보고 → 시트를 열고 → 그 후보를 다시 찾아야 했습니다.
       data-cadd는 후보 목록에서 쓰는 것과 같은 처리로 갑니다. */
    mk.bindPopup('<b>'+esc(c.title)+'</b><br>후보 여행지'+(c.addr?'<br>'+esc(c.addr):'')+
      '<br><button class="link sm" data-cadd="'+esc(c.id)+'">일정에 넣기</button>');
    marks.push(mk);
  });

  if(bounds.length) lmap.fitBounds(bounds,{padding:[46,46]});
  $('mapNote').textContent = miss? '지도에 표시하지 못한 장소 '+miss+'곳' : '';
}

var savedY = 0;
/** 열려 있는 시트가 하나라도 있으면 뒤 화면을 잠급니다.
    카운터는 어긋날 수 있어 DOM 상태에서 직접 판단합니다. */
function syncLock(){
  var open = !!document.querySelector('.scrim:not([hidden])');
  var locked = document.body.classList.contains('locked');
  if(open && !locked){
    savedY = window.scrollY || 0;
    document.body.style.top = (-savedY) + 'px';
    document.body.classList.add('locked');
  } else if(!open && locked){
    document.body.classList.remove('locked');
    document.body.style.top = '';
    window.scrollTo(0, savedY);
    onScroll();
  }
}
function open_(id){ $(id).hidden = false; syncLock(); }
function close_(id){
  // 닫을 시트가 없는 자리에서도 부릅니다(목록에서 바로 삭제하는 경우).
  var el = id ? $(id) : null;
  if(el) el.hidden = true;
  document.body.classList.remove('kb');
  syncLock();
}

/** 빠른 연타로 같은 것이 여러 번 저장되는 걸 막습니다 */
var busySave = {};
function saveGuard(key){
  if(busySave[key]) return false;
  busySave[key] = true;
  setTimeout(function(){ busySave[key] = false; }, 1500);
  return true;
}

/** 서버 응답 전에 화면부터 반영합니다 */
function optimistic(key, rec, redraw){
  var list=S[key]||(S[key]=[]);
  if(rec.id){
    for(var i=0;i<list.length;i++) if(String(list[i].id)===String(rec.id)){
      for(var k in rec) if(rec[k]!=='' || k==='memo') list[i][k]=rec[k];
      redraw(); return;
    }
  }
  var tmp={}; for(var k2 in rec) tmp[k2]=rec[k2];
  tmp.id = tmp.id || '_tmp'+Date.now();
  list.push(tmp); redraw();
}
function renderAllPlan(){ renderNow(); renderDays(); buildChips(); renderTimeline(); updatePins(); }

/** 저장은 뒤에서 진행하고, 끝나면 서버 값으로 맞춥니다 */
function saveInBackground(fn, rec){
  api(fn, rec).then(function(d){
    apply(d);
    flushQueue();                        // 연결이 살아 있으니 밀린 것도 함께 올립니다
  }).catch(function(e){
    if(e && e.net){                      // 통신 문제 — 입력을 버리지 않고 쌓아둡니다
      enqueue(fn, rec);
      saveCache(S);                      // 화면에 반영된 상태를 캐시에도 남겨 새로고침해도 유지
      syncOk=false; renderFacts();
      return toast('오프라인 — 연결되면 저장합니다');
    }
    toast('저장 실패: '+(e.message||e));  // 서버가 거부한 것은 되돌립니다
    load();
  });
}

var scrimDown = null;
function bind(){
  // 배경을 '눌러서 시작'했을 때만 닫습니다.
  // 드롭다운 피커가 닫히며 튀는 클릭에 시트가 사라지는 걸 막습니다.
  document.addEventListener('pointerdown', function(e){
    scrimDown = (e.target && e.target.classList && e.target.classList.contains('scrim')) ? e.target : null;
  }, true);

  document.addEventListener('click',function(ev){
    var t=ev.target, el;
    if((el=t.closest('.tabbar button'))) return go(el.dataset.v);
    if((el=t.closest('[data-goday]'))){ fDay=el.dataset.goday; buildChips(); renderTimeline(); return go('plan'); }
    if((el=t.closest('[data-f]'))){
      if(el.dataset.f==='day') fDay=el.dataset.v; else fCat=el.dataset.v;
      buildChips(); renderTimeline(); updatePins(); return;
    }
    if((el=t.closest('[data-mv]'))){
      ev.stopPropagation();                       // 항목이 접히지 않게
      var mv=el.dataset.mv.split('|');
      return movePlan(mv[1], mv[0]==='up' ? 'up' : 'dn');
    }
    if((el=t.closest('[data-edit]'))){ ev.stopPropagation(); return openPlan(find(S.plan,el.dataset.edit)); }
    if((el=t.closest('[data-del]'))){ ev.stopPropagation(); return del('deleteSchedule',el.dataset.del,'이 일정','sPlan'); }
    if((el=t.closest('[data-cost]'))) return openCost(find(S.expense,el.dataset.cost));
    if(t.closest('#bvEdit')){ var bid=$('bvEdit').dataset.target; close_('sBookView'); return openBook(find(S.booking||[],bid)); }
    if(t.closest('#bkAll')) return openBookAll();
    if((el=t.closest('[data-bk]'))) return openBookView(find(S.booking||[],el.dataset.bk));
    if(t.closest('#bkAdd')||t.closest('#bkAdd2')){ close_('sBookView'); return openBook(null); }
    if(t.closest('#bkFind')) return findPlace();
    if(t.closest('#bkSave')) return saveBookRow();
    if(t.closest('#bkDel')) return del('deleteBooking',$('bkId').value,'이 예약','sBook');
    if((el=t.closest('[data-copy]'))) return copyText(el.dataset.copy);
    if((el=t.closest('[data-gmove]'))) return moveGroup(el.dataset.gcat, el.dataset.gmove);
    if((el=t.closest('[data-elink]'))) return openLink(find(S.link,el.dataset.elink));
    if((el=t.closest('[data-pk]'))) return togglePack(el.dataset.pk);
    if((el=t.closest('[data-pke]'))) return openPack(find(S.pack||[],el.dataset.pke));
    if(t.closest('#pkAdd')) return openPack(null);
    if(t.closest('#lnAdd')) return openLink(null);
    if(t.closest('#pkSave')) return savePackRow();
    if(t.closest('#pkDel')) return del('deletePack',$('pkId').value,'이 준비물','sPack');
    if((el=t.closest('.ev'))&&!t.closest('a')&&!t.closest('button')){ el.classList.toggle('is-open'); return; }

    if(t.closest('#sCta')){ return VIEW==='cost'?openCost(null):VIEW==='link'?openPack(null):openPlan(null); }
    if(t.closest('#bAi')) return openChat();
    if(t.closest('#bSet')){ open_('sSet'); return renderGeoNote(); }
    if(t.closest('#bGeo')) return fillCoords();
    if(t.closest('#setDone')) return close_('sSet');
    if(t.closest('#bReload')){ load(); close_('sSet'); return toast('다시 불러왔습니다'); }
    if((el=t.closest('[data-ts]'))) return setScale(el.dataset.ts);
    if(t.closest('#pFind')) return findPlanSpot();
    if(t.closest('#pSave')) return savePlan();
    if(t.closest('#bCand')) return openCandList();
    if((el=t.closest('[data-fit]'))) return fitToPlan(+el.dataset.fit);
    if((el=t.closest('[data-cadd]'))) return candToPlan(el.dataset.cadd);
    if((el=t.closest('[data-cedit]'))) return openCand(find(candList(), el.dataset.cedit));
    if((el=t.closest('[data-cdel]'))){
      var cd=find(candList(), el.dataset.cdel);
      return del('deleteCandidate', el.dataset.cdel, cd ? cd.title : '이 후보 여행지', null);
    }
    if(t.closest('#ndAdd')) return openCand(null);
    if(t.closest('#ndAi')) return askCandAi();
    if(t.closest('#ndFind')) return findCandSpot();
    if(t.closest('#ndSave')) return saveCandRow();
    if(t.closest('#ndDel')) return del('deleteCandidate',$('ndId').value,'이 후보','sCand');
    if(t.closest('#cSave')) return saveCost();
    if(t.closest('#lSave')) return saveLinkRow();
    if(t.closest('#pDel')) return del('deleteSchedule',$('pId').value,'이 일정','sPlan');
    if(t.closest('#cDel')) return del('deleteExpense',$('cId').value,'이 지출','sCost');
    if(t.closest('#lDel')) return del('deleteLink',$('lId').value,'이 링크','sLink');
    if(t.closest('#aiSend')) return sendAi();
    if(t.closest('#aiLoc')) return toggleLoc();
    if(t.closest('#aiCam')) return $('aiFile').click();
    if(t.closest('#shotX')) return clearShot();
    if(t.closest('#aiReview')) return runReview();
    if(t.closest('#aiClear')) return wipeChat();
    if((el=t.closest('[data-q]'))){
      return el.dataset.q==='일정 검토' ? runReview() : sendAi(el.dataset.q);
    }
    if((el=t.closest('[data-fmore]'))){
      var box=el.parentElement, more=JSON.parse(box.dataset.all||'[]');
      el.remove();
      box.insertAdjacentHTML('beforeend', more.map(function(f){
        return '<div class="fitem"><span class="fbadge l'+f.level+'">'+esc(f.kind)+'</span>'+
          '<span>'+esc(f.text)+'</span></div>';
      }).join(''));
      scrollChat(); return;
    }
    if((el=t.closest('[data-fold]'))) return toggleFold(el.dataset.fold);
    if((el=t.closest('[data-undo]'))) return undoAct(el.dataset.undo);
    if((el=t.closest('[data-toplan]'))) return actToPlan(el.dataset.toplan);
    if((el=t.closest('[data-do]'))) return doAct(el.dataset.do);
    if((el=t.closest('[data-fix]'))) return fixAct(el.dataset.fix);
    if((el=t.closest('[data-skip]'))) return skipAct(el.dataset.skip);
    if((el=t.closest('[data-all]'))) return doAll(el.dataset.all);
    if((el=t.closest('[data-close]'))) return close_(el.dataset.close);
    if(t.classList.contains('scrim')){
      var ok = (scrimDown === t);
      scrimDown = null;
      if(ok) close_(t.id);
      return;
    }
  });
  $('aiIn').addEventListener('keypress',function(e){ if(e.key==='Enter') sendAi(); });
  $('aiFile').addEventListener('change',function(e){ pickShot(e.target.files[0]); e.target.value=''; });
  document.addEventListener('keydown',function(e){
    if(e.key==='Escape') document.querySelectorAll('.scrim').forEach(function(s){ if(!s.hidden) close_(s.id); });
  });
}

  chatReady = true;

/** 폰 사진은 3~4MB라 그대로 보내면 느립니다. 긴 변 1280px로 줄여서 보냅니다. */
function shrink(file, maxPx, quality){
  return new Promise(function(res, rej){
    var url=URL.createObjectURL(file), img=new Image();
    img.onload=function(){
      var w=img.width, h=img.height, s=Math.min(1, maxPx/Math.max(w,h));
      var cv=document.createElement('canvas');
      cv.width=Math.round(w*s); cv.height=Math.round(h*s);
      cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
      URL.revokeObjectURL(url);
      res(cv.toDataURL('image/jpeg', quality));
    };
    img.onerror=function(){ URL.revokeObjectURL(url); rej(new Error('이미지를 읽지 못했습니다')); };
    img.src=url;
  });
}

function pickShot(file){

  shrink(file, 1280, 0.82).then(function(dataUrl){
    shotData = { mime:'image/jpeg', data: dataUrl.split(',')[1], url: dataUrl };
    $('shotImg').src = dataUrl;
    $('shot').hidden = false;
    if(!$('aiIn').value) $('aiIn').placeholder = '사진에 대해 물어보세요 (그냥 보내도 됩니다)';
    scrollChat();
  }).catch(function(){ toast('사진을 읽지 못했습니다'); });
}

/** AI가 언급한 장소에 확인용 링크를 답니다. 요약된 숫자보다 원본이 정확합니다. */
/* ── AI 답변에 붙는 장소 링크 ──
   한국에서 "도쿄 긴자 우시구로"처럼 한글로 검색하면 구글이 현재 위치를 기준으로
   엉뚱한 국내 가게를 내놓습니다. 그래서 좌표 > 현지어 이름 > 한글 순으로
   덜 흔들리는 것을 먼저 씁니다. */
function normName(s){
  return String(s==null?'':s).toLowerCase().replace(/[\s·\-()（）\[\]]/g,'');
}
function okCoord(la, ln){
  la = Number(la); ln = Number(ln);
  return isFinite(la) && isFinite(ln) && !(la === 0 && ln === 0);
}
/* 일정에 저장된 좌표가 AI가 낸 것보다 정확합니다. 이름이 겹치면 그쪽을 씁니다.
   (일정 제목은 "긴자 하치고 (銀座 八五)"처럼 병기된 경우가 있어 부분 일치도 봅니다) */
function savedCoordFor(name){
  var n = normName(name);
  if(n.length < 2) return null;
  var hit = null;
  (S.plan||[]).forEach(function(p){
    if(hit || !okCoord(p.lat, p.lng)) return;
    var t = normName(p.title);
    if(t.length < 2) return;
    if(t === n || t.indexOf(n) !== -1 || n.indexOf(t) !== -1) hit = {lat:Number(p.lat), lng:Number(p.lng)};
  });
  return hit;
}
function placeMapUrl(p, dest){
  var c = savedCoordFor(p.name) || (p.localName ? savedCoordFor(p.localName) : null);
  if(!c && okCoord(p.lat, p.lng)) c = {lat:Number(p.lat), lng:Number(p.lng)};
  // 검색어는 현지어 우선. 일본어면 그것만으로도 구글이 일본으로 잡습니다.
  var q = p.localName || (dest + p.name);
  // 좌표는 '검색어'가 아니라 '지도 중심'으로 씁니다.
  // 좌표만 넘기면 이름 없는 맨 핀이 떠서 평점·영업시간을 볼 수 없습니다.
  if(c) return 'https://www.google.com/maps/search/' + encodeURIComponent(q) +
                '/@' + c.lat + ',' + c.lng + ',17z';
  return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(q);
}
/* 타베로그의 검색 페이지(/rstLst/)는 접근이 자주 차단됩니다("アクセスが集中").
   개별 가게 페이지는 정상으로 열리므로, 구글에서 tabelog.com 안으로만 검색해
   가게 페이지로 바로 갈 수 있게 합니다.
   현지어 이름 + 사이트 제한이라 첫 결과가 거의 항상 그 가게입니다. */
function tabelogUrl(p){
  return 'https://www.google.com/search?q=' +
         encodeURIComponent((p.localName || p.name) + ' site:tabelog.com');
}

/** 같은 날 45분 이내에 다른 일정이 있으면 알려줍니다 */

  var hit=S.plan.filter(function(p){
    return String(p.day)===String(a.day) && String(p.id)!==String(a.id||'') && Math.abs(toMin(p.time)-t)<45;
  });
  return hit.length ? '같은 시간대에 ' + nice(hit[0].title) + ' (' + hit[0].time + ') 이(가) 있습니다.' : '';
}

/* ═══════════ 되돌리기 ═══════════
   AI가 적용한 것만 되돌립니다(HANDOFF 11장). 적용 직전 상태를 기억해 두었다가
   반대 동작을 실행합니다.
   - 추가/지출 → 새로 생긴 항목을 지웁니다 (적용 전후 id를 비교해 찾습니다)
   - 수정/삭제 → 원래 값으로 되돌립니다.
     서버 save_는 id를 못 찾으면 새로 추가하므로 삭제한 것도 같은 id로 복원됩니다. */
var undos={};
function ids(list){ var m={}; (list||[]).forEach(function(x){ m[String(x.id)]=1; }); return m; }
function newIdIn(before, after){
  var hit=null;
  (after||[]).forEach(function(x){ if(!hit && !before[String(x.id)]) hit=String(x.id); });
  return hit;
}
function undoAct(k){
  var u=undos[k]; if(!u) return;
  var card=document.querySelector('[data-card="'+k+'"]');
  if(card) card.classList.add('is-busy');
  u.run().then(function(d){
    var c=S.chat; apply(d); S.chat=c;
    delete undos[k];
    if(card){
      card.classList.remove('is-busy');
      var done=card.querySelector('.act__done');
      if(done) done.textContent='되돌렸습니다';
      var btn=card.querySelector('[data-undo]');
      if(btn) btn.remove();
    }
    toast('되돌렸습니다');
  }).catch(function(e){
    if(card) card.classList.remove('is-busy');
    toast('되돌리지 못했습니다: '+(e.message||e));
  });
}

/* 제안 카드에서 곧바로 일정으로. 후보를 거치지 않습니다.
 * candidate 제안에는 날짜·시간이 없으므로 일정 시트를 채워서 열고 그 둘만 고르게 합니다.
 * 대화창(sAi)이 일정 시트(sPlan)보다 DOM 뒤라 안 닫으면 시트를 덮습니다. */
var pFromAct = null;
function actToPlan(k){
  var a=pending[k]; if(!a) return;
  close_('sAi');
  openPlan({ title:a.title, cat:a.cat, memo:a.memo, lat:a.lat, lng:a.lng });
  pFromAct=k;                       // openPlan이 먼저 비우므로 그 뒤에
  $('planH').textContent='제안을 일정으로';
}

/** 일정으로 옮긴 제안 카드를 처리 완료로 표시합니다 */
function markActDone(k){
  var card=document.querySelector('[data-card="'+k+'"]');
  if(card){
    card.classList.add('is-done');
    card.insertAdjacentHTML('beforeend','<div class="act__done">일정에 넣었습니다</div>');
  }
  delete pending[k];
}

function doAct(k){
  var a=pending[k]; if(!a) return;
  var card=document.querySelector('[data-card="'+k+'"]');
  if(card) card.classList.add('is-busy');

  // 적용 전 상태를 기록해 둡니다
  var beforePlan=ids(S.plan), beforeExp=ids(S.expense), beforeCand=ids(candList());
  var prev=(a.type==='edit'||a.type==='delete') ? find(S.plan, a.id) : null;
  if(prev) prev=JSON.parse(JSON.stringify(prev));

  var p;
  if(a.type==='expense'){
    p=api('saveExpense',{ id:'', day:a.day, title:a.title, amount:a.amount, cur:a.cur||'JPY', method:a.method||'현금', payer:a.payer||'' });
  }
  else if(a.type==='candidate'){
    p=api('saveCandidate',{ id:'', title:a.title, cat:a.cat, addr:a.addr||'', memo:a.memo||'',
      lat:a.lat||'', lng:a.lng||'', src:a.src||'AI 추천' });
  }
  else if(a.type==='delete') p=api('deleteSchedule', a.id);
  else if(a.type==='edit'){
    var cur=find(S.plan, a.id)||{};
    p=api('saveSchedule',{ id:a.id, day:a.day||cur.day, time:a.time||cur.time,
      cat:a.cat||cur.cat, title:a.title||cur.title, memo:a.memo||cur.memo,
      lat:a.lat||cur.lat||'', lng:a.lng||cur.lng||'' });
  } else {
    p=api('saveSchedule',{ id:'', day:a.day, time:a.time, cat:a.cat, title:a.title, memo:a.memo,
      lat:a.lat||'', lng:a.lng||'' });
  }

  return p.then(function(d){
    var keepChat=S.chat; apply(d); S.chat=keepChat;

    // 반대 동작을 만들어 둡니다
    if(a.type==='expense'){
      var ne=newIdIn(beforeExp, S.expense);
      if(ne) undos[k]={ run:function(){ return api('deleteExpense', ne); } };
    } else if(a.type==='candidate'){
      var nc=newIdIn(beforeCand, candList());
      if(nc) undos[k]={ run:function(){ return api('deleteCandidate', nc); } };
    } else if(a.type==='add' || !prev){
      var np=newIdIn(beforePlan, S.plan);
      if(np) undos[k]={ run:function(){ return api('deleteSchedule', np); } };
    } else {
      undos[k]={ run:function(){ return api('saveSchedule', { id:prev.id, day:prev.day,
        time:prev.time, cat:prev.cat, title:prev.title, memo:prev.memo,
        lat:prev.lat||'', lng:prev.lng||'' }); } };
    }

    if(card){
      card.classList.remove('is-busy'); card.classList.add('is-done');
      card.insertAdjacentHTML('beforeend','<div class="act__done">' +
        (a.type==='delete'?'삭제했습니다':a.type==='edit'?'수정했습니다':
         a.type==='expense'?'지출에 넣었습니다':
         a.type==='candidate'?"후보 여행지에 담았습니다":'일정에 넣었습니다') + '</div>');
      if(undos[k]) card.insertAdjacentHTML('beforeend',
        '<button class="link sm" data-undo="'+k+'" style="margin-top:6px">되돌리기</button>');
    }
    delete pending[k];
    toast(a.type==='delete'?'삭제했습니다':'반영했습니다');
  }).catch(function(e){
    if(card) card.classList.remove('is-busy');
    toast('실패: '+(e.message||e));
  });
}

function doAll(keys){
  var list=keys.split(',').filter(function(k){ return pending[k]; });
  (function next(i){
    if(i>=list.length) return;
    var r=doAct(list[i]);
    if(r && r.then) r.then(function(){ next(i+1); }); else next(i+1);
  })(0);
}

function fixAct(k){
  var a=pending[k]; if(!a) return;
  close_('sAi');
  if(a.type==='expense') return openCost({ day:a.day, title:a.title, amount:a.amount, cur:a.cur, method:a.method, payer:a.payer });
  openPlan({ id:a.type==='edit'?a.id:'', day:a.day, time:a.time, cat:a.cat, title:a.title, memo:a.memo,
    lat:a.lat, lng:a.lng });
}

function skipAct(k){
  var card=document.querySelector('[data-card="'+k+'"]');
  if(card){ card.classList.add('is-done');
    card.insertAdjacentHTML('beforeend','<div class="act__done" style="color:var(--ink-48)">넘어갔습니다</div>'); }
  delete pending[k];
}

function wipeChat(){
  if(!confirm('대화 기록을 지울까요? 시트에서도 사라집니다.')) return;
  pending={}; clearShot();
  api('clearChat').then(function(d){ S=d; paintChat(); toast('대화를 지웠습니다'); })
    .catch(function(){ toast('지우지 못했습니다'); });
}

function getRate(){
  fetch('https://open.er-api.com/v6/latest/JPY').then(function(r){ return r.json(); })
    .then(function(d){ if(d&&d.rates&&d.rates.KRW){ rate=d.rates.KRW; renderFacts(); renderCost(); } })
    .catch(function(){});
}
function getWeather(){
  fetch('https://api.open-meteo.com/v1/forecast?latitude=35.6762&longitude=139.6503&current_weather=true')
    .then(function(r){ return r.json(); })
    .then(function(d){
      if(!d||!d.current_weather) return;
      var c=d.current_weather.weathercode;
      var t=c===0?'맑음':c<=3?'구름':c<=48?'안개':c<=67?'비':c<=77?'눈':'소나기';
      window._w=Math.round(d.current_weather.temperature)+'° '+t;
      renderFacts();
    }).catch(function(){});
}
</script>

<!-- 서비스워커 등록: 앱 셸을 캐시해 오프라인 동작 -->
<script>
if('serviceWorker' in navigator){
  /* 아이폰 홈 화면 앱은 앱 전환기에서 되살리면 load가 다시 돌지 않습니다.
   * 등록만 해두면 새 sw.js를 확인할 기회가 영영 없어서, 고쳐 올려도 옛 화면이 그대로 뜹니다.
   * 그래서 화면이 다시 보일 때마다 업데이트를 확인하고,
   * 새 서비스워커가 넘겨받으면 한 번만 새로고침합니다. */
  var swHad = !!navigator.serviceWorker.controller;   // 이미 제어 중이었나(=처음 설치가 아님)
  var swReloading = false, swLastCheck = 0;

  navigator.serviceWorker.addEventListener('controllerchange', function(){
    if(swReloading || !swHad) return;   // 처음 설치 때는 새로고침하지 않습니다
    swReloading = true;
    location.reload();
  });

  function swCheck(){
    var now = Date.now();
    if(now - swLastCheck < 60000) return;   // 1분에 한 번이면 충분합니다
    swLastCheck = now;
    navigator.serviceWorker.getRegistration()
      .then(function(reg){ if(reg) return reg.update(); })
      .catch(function(){});
  }

  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js')
      .catch(function(e){ console.warn('SW 등록 실패', e); });
  });
  document.addEventListener('visibilitychange', function(){ if(!document.hidden) swCheck(); });
  window.addEventListener('focus', swCheck);
}
</script>
